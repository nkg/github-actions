name: SOPS audit

# Generalised from sproncy-secrets/sops-audit.yml. Verifies that files
# matching the encrypted-glob are SOPS-encrypted, scans the tree for
# plaintext-secret patterns, optionally runs shellcheck and a CHANGELOG
# diff check when .sops.yaml age recipients change.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      encrypted-glob:
        description: "find -name pattern for files that MUST be SOPS-encrypted"
        type: string
        default: "*.encrypted"
      plaintext-scan:
        description: "Scan tracked .env/.yml/.yaml/.json/.toml for plaintext secrets"
        type: boolean
        default: true
      plaintext-scan-exclude:
        description: "Newline-separated case-style globs to skip (e.g. 'tests/fixtures/*')"
        type: string
        default: ""
      shellcheck:
        description: "Run shellcheck against shellcheck-paths"
        type: boolean
        default: false
      shellcheck-paths:
        description: "Newline-separated paths to recursively shellcheck. Default: scripts/ if present."
        type: string
        default: ""
      sops-config-changelog:
        description: "Require an entry in changelog-path when .sops.yaml age recipients change"
        type: boolean
        default: false
      changelog-path:
        type: string
        default: "CHANGELOG-keys.md"

jobs:
  audit:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sops-config-changelog needs history to diff against base.
          fetch-depth: ${{ inputs.sops-config-changelog && 0 || 1 }}

      - name: Verify SOPS encryption
        env:
          GLOB: ${{ inputs.encrypted-glob }}
        run: |
          set -euo pipefail
          found=0
          fail=0
          # Regex: anchored ^sops:, ^sops_, or quoted "sops" key (JSON form)
          while IFS= read -r -d '' file; do
            found=1
            if grep -q -E '^sops:|^sops_|"sops"' "$file"; then
              echo "::notice file=$file::encrypted"
            elif [ ! -s "$file" ]; then
              echo "::warning file=$file::empty placeholder, skipping"
            else
              echo "::error file=$file::NOT encrypted"
              fail=1
            fi
          done < <(find . -name "$GLOB" -type f -not -path './.git/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::warning::no files match $GLOB"
          fi
          exit "$fail"

      - name: Scan for plaintext secrets
        if: inputs.plaintext-scan
        env:
          EXCLUDES: ${{ inputs.plaintext-scan-exclude }}
        run: |
          set -euo pipefail
          # ERE that matches common secret-assignment forms in config files.
          # Anchors on the key name so prose hits like "this is a token for X"
          # are excluded by the [:=] requirement.
          KEY='(password|passwd|secret|api[_-]?key|token|private[_-]?key|access[_-]?key)'
          SEP='[[:space:]]*[:=][[:space:]]*'
          Q='["'"'"']?'
          pattern="${KEY}${SEP}${Q}[A-Za-z0-9/_+.=-]{8,}"

          # --- Allowlist -------------------------------------------------
          # The pattern above has no notion of what a value MEANS, so
          # ordinary configuration trips it: `update_password: on_create` is
          # the documented API of ansible.builtin.user, and `on_create`
          # clears the 8-character floor. Consumers cannot reword task code
          # around it, and their only lever was excluding a whole file from
          # scanning — disarming real detection to silence one line.
          #
          # Two classes are suppressed, both cases where the value CANNOT be
          # a secret:
          #
          #   1. Indirection — the value names something else rather than
          #      being the thing. Jinja/Go templates, shell and env
          #      expansion, Ansible vault refs, lookups, and SOPS ciphertext.
          IND="${KEY}${SEP}${Q}([{][{]|[$][{]|[$][A-Za-z_]|ENC[[]|!vault|lookup[(])"
          #
          #   2. Config enums — a closed set of literals that are values of
          #      a setting, not credentials.
          ENUMS='on_create|always|never|absent|present|true|false|yes|no|none|null|enabled|disabled|required|optional|latest|stable|default|auto|ignore|prompt'
          ENUM="${KEY}${SEP}${Q}(${ENUMS})${Q}[[:space:]]*(#.*)?$"
          #
          # Deliberately NOT allowlisted: changeme, placeholder, secret,
          # password and friends. Those are plausible real bad values and
          # must keep failing. The allowlist only ever suppresses; it never
          # widens what counts as a secret.
          #
          # See https://github.com/nkg/github-actions/issues/74
          any=0
          while IFS= read -r file; do
            # Skip via case-globs from input.
            if [ -n "$EXCLUDES" ]; then
              skip=0
              while IFS= read -r excl; do
                [ -z "$excl" ] && continue
                # shellcheck disable=SC2254
                case "$file" in $excl) skip=1; break ;; esac
              done <<< "$EXCLUDES"
              [ "$skip" -eq 1 ] && continue
            fi
            case "$file" in
              *.env|*.yml|*.yaml|*.json|*.toml) ;;
              *) continue ;;
            esac
            # Don't flag SOPS-encrypted files (the ciphertext can look
            # secret-ish). `[sops]` is the TOML form of the metadata block;
            # without it an encrypted .toml was scanned rather than skipped,
            # even though .toml is in the extension list above.
            if grep -q -E '^sops:|^sops_|"sops"|^\[sops\]' "$file" 2>/dev/null; then
              continue
            fi
            # Match, then drop the allowlisted forms. Reported from the same
            # filtered list that decides pass/fail, so what you are shown is
            # exactly what failed the build.
            hits=$(grep -E -i -n "$pattern" "$file" 2>/dev/null \
                     | grep -v -E -i "$IND" \
                     | grep -v -E -i "$ENUM" || true)
            if [ -n "$hits" ]; then
              echo "::error file=$file::potential plaintext secret"
              printf '%s\n' "$hits" | head -5
              any=1
            fi
          done < <(git ls-files)
          if [ "$any" -eq 1 ]; then exit 1; fi
          echo "no plaintext secrets detected"

      - name: Install shellcheck
        if: inputs.shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends shellcheck
          fi

      - name: Run shellcheck
        if: inputs.shellcheck
        env:
          PATHS: ${{ inputs.shellcheck-paths }}
        run: |
          set -euo pipefail
          if [ -z "$PATHS" ]; then
            if [ -d scripts ]; then
              PATHS="scripts"
            else
              echo "no scripts/ directory and no shellcheck-paths input — skipping"
              exit 0
            fi
          fi
          # Lint the explicit set of paths; -x lets it follow `source` directives.
          # shellcheck disable=SC2086
          find $PATHS -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 -r shellcheck -x --source-path=SCRIPTDIR

      - name: Check .sops.yaml CHANGELOG
        if: inputs.sops-config-changelog
        env:
          CHANGELOG: ${{ inputs.changelog-path }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "first push to ref — skipping changelog diff check"
              exit 0
            fi
          fi
          if ! git diff --name-only "$base" "$head" -- .sops.yaml | grep -q .; then
            echo ".sops.yaml unchanged — no changelog entry required"
            exit 0
          fi
          if ! git diff -U0 "$base" "$head" -- .sops.yaml | grep -E '^[+-][[:space:]]*age:' >/dev/null; then
            echo ".sops.yaml changed but no age recipients touched — no changelog entry required"
            exit 0
          fi
          if git diff --name-only "$base" "$head" -- "$CHANGELOG" | grep -q .; then
            echo "$CHANGELOG was updated alongside .sops.yaml age recipients"
          else
            echo "::error::$CHANGELOG MUST be updated when .sops.yaml age recipients change"
            exit 1
          fi
