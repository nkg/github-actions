name: Elixir

on:
  workflow_call:
    inputs:
      elixir-version:
        description: "Elixir version"
        type: string
        default: "1.20"
      otp-version:
        description: "OTP version"
        type: string
        default: "28"
      use-mise:
        description: |
          Install Erlang/Elixir via mise (reads the consumer's mise.toml)
          instead of erlef/setup-beam. Overrides elixir-version/otp-version.
        type: boolean
        default: false
      working-directory:
        description: "Directory containing mix.exs"
        type: string
        default: "."
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      run-format-check:
        description: "Run mix format --check-formatted"
        type: boolean
        default: true
      run-credo:
        description: "Run mix credo --strict"
        type: boolean
        default: true
      run-dialyzer:
        description: "Run mix dialyzer (slow; off by default)"
        type: boolean
        default: false
      run-tests:
        description: "Run mix test in the main job (skipped automatically when run-db-tests is true — the db-test job runs it instead)"
        type: boolean
        default: true
      mix-env:
        description: "MIX_ENV for the test step"
        type: string
        default: "test"
      run-sobelow:
        description: "Run sobelow (Phoenix security scanner)"
        type: boolean
        default: false
      sobelow-args:
        type: string
        default: "--config"
      run-hex-audit:
        description: "Run `mix hex.audit` to flag retired/insecure deps"
        type: boolean
        default: false
      run-deps-audit:
        description: |
          Run `mix deps.audit` (mix_audit) to scan mix.lock for deps with
          known CVEs. Requires the consumer to depend on {:mix_audit, ...}.

          NOTE: this is not a complete gate on its own — mix_audit reads only
          the mirego/elixir-security-advisories mirror, which lags the feed Hex
          itself queries. Pair it with run-hex-advisory-check.
        type: boolean
        default: false
      run-prod-compile:
        description: |
          Additionally compile with `MIX_ENV=prod`, to catch breakage that only
          exists in the production build.

          Worth turning on for anything that ships a Mix release. A release
          evaluates `config/config.exs` at *build* time under `MIX_ENV=prod`,
          which is a path the normal dev/test compile never touches — a missing
          `config/prod.exs`, a bad `import_config`, or code that only compiles
          under dev/test all pass CI and then fail when the image is built.

          Where a repo builds its image on `main` only (a common pattern, to
          keep PR-controlled Dockerfiles off self-hosted runners), that failure
          lands *after* merge, so `main` goes red on a diff that already passed
          review. This check moves it to PR time for a fraction of the cost of
          a full image build.

          Not `--warnings-as-errors`: the goal is "does the production build
          work", not warning hygiene, and prod-only warnings in a dependency
          shouldn't red-line a consumer. `_build` is already cached, so the
          extra prod tree costs a full compile only when the lockfile changes.
        type: boolean
        default: false
      run-hex-advisory-check:
        description: |
          Fail the build when Hex's own resolver reports a security advisory
          against a resolved dependency (the `VULNERABLE!` markers it prints
          during `mix deps.get`).

          Why this exists alongside run-deps-audit: mix_audit resolves
          advisories from a single mirror (mirego/elixir-security-advisories,
          synced from the GitHub Advisory Database). That mirror lags, and
          advisories that never reach it are never reported at all — so
          `mix deps.audit` can print "No vulnerabilities found." while Hex
          flags a HIGH against the very same mix.lock. A gate that returns
          green off stale data is worse than no gate, because it is trusted.
          Hex queries the live feed on every resolution, so this check is
          current by construction.

          Off by default: switching it on can red-line a repo whose deps carry
          an advisory nobody has triaged yet. Turn it on deliberately, and use
          hex-advisory-ignore for advisories you have assessed and cannot yet
          act on.
        type: boolean
        default: false
      hex-advisory-ignore:
        description: |
          Comma-separated advisory IDs that run-hex-advisory-check should
          tolerate rather than fail on. Matches the primary ID Hex prints or
          any of its `aka:` aliases, so an EEF-CVE-…, CVE-… or GHSA-… form all
          work (mix_audit's --ignore-advisory-ids takes GHSA ids, so reusing
          that value here keeps the two lists in one dialect).

          Ignored advisories are still printed, as notices — they stay visible
          in the log instead of disappearing.
        type: string
        default: ""
      deps-reader-client-id:
        description: |
          GitHub App client ID for private-dep access (private hex packages or
          git deps behind private repos). When set, a scoped installation token
          is minted (via setup-deps-reader) and git's credential helper is wired
          before `mix deps.get`. Pair with deps-reader-repositories and the
          DEPS_READER_PRIVATE_KEY secret. Empty = no private-deps step.
        type: string
        default: ""
      deps-reader-repositories:
        description: "Comma-separated repo names (no owner) the token is scoped to. Required when deps-reader-client-id is set."
        type: string
        default: ""
      run-db-tests:
        description: |
          Run `mix test` in a separate job with Postgres + Valkey service
          containers (for Ecto/cache-backed suites). When true, the main job's
          test step is skipped to avoid running the suite twice without a DB.
        type: boolean
        default: false
      postgres-image:
        description: "Postgres service image (only used when run-db-tests)"
        type: string
        default: "postgres:18-alpine"
      postgres-user:
        type: string
        default: "postgres"
      postgres-password:
        type: string
        default: "postgres"
      postgres-db:
        type: string
        default: "postgres"
      valkey-image:
        description: "Valkey/Redis service image (only used when run-db-tests)"
        type: string
        default: "valkey/valkey:9-alpine"
      run-ecto-setup:
        description: "Run `mix ecto.create && mix ecto.migrate` before the DB test suite"
        type: boolean
        default: true
      database-url:
        description: |
          Fully override DATABASE_URL for the db-test job (host included).
          Empty = derived from the postgres-* inputs against the host the job
          can actually reach (localhost on GitHub-hosted runners, the service
          container's network IP on containerized self-hosted runners).
        type: string
        default: ""
    secrets:
      DEPS_READER_PRIVATE_KEY:
        description: "Private key for the deps-reader GitHub App (required when deps-reader-client-id is set)"
        required: false

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    env:
      MIX_ENV: ${{ inputs.mix-env }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Private-deps access (opt-in). Full path + floating major tag: a relative
      # ./.github/actions path inside a reusable resolves against the consumer's
      # checkout, not this repo. The composite sets git's global credential
      # helper, so private hex/git deps resolve in the deps.get below.
      - name: Configure private-deps access
        if: inputs.deps-reader-client-id != ''
        uses: nkg/github-actions/.github/actions/setup-deps-reader@v2
        with:
          app-client-id: ${{ inputs.deps-reader-client-id }}
          app-private-key: ${{ secrets.DEPS_READER_PRIVATE_KEY }}
          repositories: ${{ inputs.deps-reader-repositories }}

      # Same full-path pattern as setup-deps-reader above: installs mise,
      # caches the tool dir, and runs `mise install` against the consumer's
      # mise.toml (which pins erlang + elixir there).
      - name: Setup mise toolchain
        if: inputs.use-mise
        uses: nkg/github-actions/.github/actions/setup-mise@v2
        with:
          working-directory: ${{ inputs.working-directory }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        if: ${{ !inputs.use-mise }}
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}

      - name: Cache deps and _build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: ${{ runner.os }}-mix-${{ inputs.otp-version }}-${{ inputs.elixir-version }}-${{ hashFiles(format('{0}/mix.lock', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ inputs.otp-version }}-${{ inputs.elixir-version }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Compile (MIX_ENV=prod)
        # Exercises the production build path: config.exs is re-evaluated with
        # config_env() == :prod, so a missing config/prod.exs or a broken
        # import_config fails here rather than in a post-merge image build.
        if: inputs.run-prod-compile
        env:
          MIX_ENV: prod
        run: |
          mix deps.get
          mix compile

      - name: Format check
        if: inputs.run-format-check
        run: mix format --check-formatted

      - name: Credo
        if: inputs.run-credo
        run: mix credo --strict

      - name: Dialyzer
        if: inputs.run-dialyzer
        run: mix dialyzer

      - name: Test
        # Skipped when run-db-tests is true — the db-test job runs the suite
        # with service containers instead, so we don't run it twice DB-less.
        if: inputs.run-tests && !inputs.run-db-tests
        run: mix test

      - name: hex.audit
        if: inputs.run-hex-audit
        run: mix hex.audit

      - name: deps.audit (mix_audit CVE scan)
        if: inputs.run-deps-audit
        run: mix deps.audit

      - name: Hex advisory gate (live advisory feed)
        # Complements deps.audit rather than replacing it. mix_audit reads the
        # mirego/elixir-security-advisories mirror; anything absent from that
        # mirror is silently absent from its report. Hex checks the live feed
        # on every resolution, so it catches what the mirror has not picked up.
        if: inputs.run-hex-advisory-check
        env:
          HEX_ADVISORY_IGNORE: ${{ inputs.hex-advisory-ignore }}
        run: |
          set -uo pipefail

          # Deps are already fetched by "Install dependencies"; this re-resolves
          # so the advisory annotations are attached to output we own. Hex prints
          # them on an unchanged tree too, so this is cheap.
          out=$(mix deps.get 2>&1)
          printf '%s\n' "$out"
          echo "---"

          # Hex prints, per affected package:
          #     bandit 1.12.4 VULNERABLE!
          #       EEF-CVE-2026-74836 (HIGH)
          #       aka: CVE-2026-74836, GHSA-xj8g-532w-jv94
          #       <title>
          #       <url>
          # Flatten that to one "package version|id|severity|aka" record per
          # advisory (a package can carry several).
          findings=$(printf '%s\n' "$out" | awk '
            function flush() {
              if (id != "") { print pkg "|" id "|" sev "|" aka; id = ""; sev = ""; aka = "" }
            }
            $NF == "VULNERABLE!" { flush(); pkg = $1 " " $2; next }
            pkg != "" && NF == 2 && $2 ~ /^\([A-Z]+\)$/ {
              flush(); id = $1; sev = substr($2, 2, length($2) - 2); next
            }
            pkg != "" && $1 == "aka:" { sub(/^[[:space:]]*aka:[[:space:]]*/, "", $0); aka = $0; next }
            END { flush() }
          ')

          # The failure mode this whole gate exists to prevent is a security
          # check that reports green off data it did not actually read. If Hex
          # says there are advisories and the parser extracted none, its output
          # format has moved — fail, do not pass quietly.
          if printf '%s\n' "$out" | grep -q "VULNERABLE!" && [ -z "$findings" ]; then
            echo "::error::Hex reported advisories but this gate parsed none — its output format has probably changed. Fix the parser in elixir.yml; do not silence this."
            exit 1
          fi

          if [ -z "$findings" ]; then
            echo "No Hex security advisories for any resolved dependency."
            exit 0
          fi

          blocking=0
          ignore_list="${HEX_ADVISORY_IGNORE:-}"
          while IFS='|' read -r pkg id sev aka; do
            [ -n "$id" ] || continue
            ignored=0
            for ig in ${ignore_list//,/ }; do
              [ -n "$ig" ] || continue
              # Match the primary id or any alias, so GHSA-/CVE-/EEF-CVE- forms
              # of the same advisory are interchangeable in the ignore list.
              case " $id ${aka//,/ } " in *" $ig "*) ignored=1; break ;; esac
            done
            if [ "$ignored" = 1 ]; then
              echo "::notice::ignored advisory $id ($sev) in $pkg [aka: ${aka:-none}]"
            else
              echo "::error::$pkg has $sev advisory $id [aka: ${aka:-none}]"
              blocking=$((blocking + 1))
            fi
          done <<< "$findings"

          if [ "$blocking" -gt 0 ]; then
            echo "::error::$blocking unignored Hex security advisory/advisories — failing the build. Upgrade the dependency, or add the id to hex-advisory-ignore with a reason."
            exit 1
          fi
          echo "All reported Hex advisories are explicitly ignored via hex-advisory-ignore."

      - name: sobelow
        if: inputs.run-sobelow
        env:
          ARGS: ${{ inputs.sobelow-args }}
        run: |
          mix archive.install hex sobelow --force
          # shellcheck disable=SC2086
          mix sobelow $ARGS

  # Optional Ecto/cache-backed test suite with Postgres + Valkey. Gated by
  # run-db-tests: when the consumer doesn't opt in, this job is skipped.
  #
  # Postgres and Valkey are started with `docker run` (not a job-level
  # `services:` block) and addressed by a host the steps can actually reach.
  # On the org's containerized self-hosted runners the job runs inside a
  # container with a sibling Docker daemon, so a service container's published
  # port lands on the daemon host, not on the job container's localhost —
  # localhost:5432 is refused there (a `services:` health check still passes,
  # because it probes inside the service container, masking the problem). The
  # Start steps below detect the containerized case, attach the service to the
  # job container's own network, and export DATABASE_URL / VALKEY_URL pointing
  # at its network IP. Mirrors the proven pattern in go.yml.
  test-db:
    if: inputs.run-db-tests
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      MIX_ENV: ${{ inputs.mix-env }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure private-deps access
        if: inputs.deps-reader-client-id != ''
        uses: nkg/github-actions/.github/actions/setup-deps-reader@v2
        with:
          app-client-id: ${{ inputs.deps-reader-client-id }}
          app-private-key: ${{ secrets.DEPS_READER_PRIVATE_KEY }}
          repositories: ${{ inputs.deps-reader-repositories }}

      - name: Setup mise toolchain
        if: inputs.use-mise
        uses: nkg/github-actions/.github/actions/setup-mise@v2
        with:
          working-directory: ${{ inputs.working-directory }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        if: ${{ !inputs.use-mise }}
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}

      - name: Cache deps and _build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ inputs.working-directory }}/deps
            ${{ inputs.working-directory }}/_build
          key: ${{ runner.os }}-mix-${{ inputs.otp-version }}-${{ inputs.elixir-version }}-${{ hashFiles(format('{0}/mix.lock', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ inputs.otp-version }}-${{ inputs.elixir-version }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Start Postgres via `docker run` and export a reachable DATABASE_URL.
      # See the job-level comment for why a `services:` block can't be reached
      # on containerized self-hosted runners.
      - name: Start Postgres
        env:
          PG_IMAGE: ${{ inputs.postgres-image }}
          PG_USER: ${{ inputs.postgres-user }}
          PG_PASSWORD: ${{ inputs.postgres-password }}
          PG_DB: ${{ inputs.postgres-db }}
          DATABASE_URL_OVERRIDE: ${{ inputs.database-url }}
        run: |
          set -euo pipefail
          # Self-hosted runners reuse the workspace, so a container left over
          # from a cancelled run collides on the name. Remove any stale one.
          docker rm -f ci-postgres >/dev/null 2>&1 || true
          docker run -d --name ci-postgres \
            -e POSTGRES_USER="$PG_USER" \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e POSTGRES_DB="$PG_DB" \
            -p 5432:5432 \
            "$PG_IMAGE"
          # Poll pg_isready inside the container (image pull + init takes a few
          # seconds), capped at ~60s.
          #
          # -h 127.0.0.1 IS THE POINT, not decoration. On first init the
          # postgres image's entrypoint runs a TEMPORARY server so it can
          # execute initdb and any /docker-entrypoint-initdb.d scripts, then
          # stops it and starts the real one. That temporary server is started
          # with `listen_addresses=''` — reachable over the Unix socket but NOT
          # over TCP. A socket-based probe (pg_isready with no -h) therefore
          # returns 0 against the temporary server, the wait exits early, and
          # the consumer's first real connection lands during the restart and
          # gets `FATAL 57P03 (cannot_connect_now) the database system is
          # starting up`. Probing TCP cannot pass early: pg_isready exits 1
          # ("rejecting connections") for the whole of that window.
          for i in $(seq 1 60); do
            if docker exec ci-postgres \
                 pg_isready -h 127.0.0.1 -p 5432 -U "$PG_USER" -d "$PG_DB" >/dev/null 2>&1; then
              echo "postgres accepting TCP connections after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::postgres did not become ready in 60s"
              docker logs ci-postgres || true
              exit 1
            fi
            sleep 1
          done
          # Belt and braces: pg_isready reports the listener state, not that a
          # query will succeed. One real round trip closes the gap, and fails
          # here with the server's own logs rather than inside a consumer's
          # migration step, where the cause is much harder to read.
          if ! docker exec ci-postgres \
                 psql -h 127.0.0.1 -U "$PG_USER" -d "$PG_DB" -c 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::postgres accepted a connection but could not serve a query"
            docker logs ci-postgres || true
            exit 1
          fi
          # Pick a host the Ecto steps can reach. On GitHub-hosted runners the
          # job runs on the VM, so the published port is on localhost. On a
          # containerized self-hosted runner the job is inside a container with
          # a sibling daemon, so -p publishes to the daemon host (localhost is
          # refused). Detect that, attach Postgres to the job container's
          # network, and address it by that network IP.
          PG_HOST=localhost
          if [ -f /.dockerenv ]; then
            SELF="$(cat /etc/hostname)"
            NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$SELF" 2>/dev/null | head -n1 || true)"
            if [ -n "$NET" ]; then
              docker network connect "$NET" ci-postgres
              PG_HOST="$(docker inspect -f "{{(index .NetworkSettings.Networks \"$NET\").IPAddress}}" ci-postgres)"
              echo "containerized runner: reaching postgres at ${PG_HOST}:5432 via network ${NET}"
            fi
          fi
          # database-url input fully overrides (host included) when set;
          # otherwise derive from the postgres-* inputs + the detected host.
          if [ -n "$DATABASE_URL_OVERRIDE" ]; then
            echo "DATABASE_URL=$DATABASE_URL_OVERRIDE" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=ecto://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:5432/${PG_DB}" >> "$GITHUB_ENV"
          fi
          {
            echo "PGHOST=${PG_HOST}"
            echo "PGPORT=5432"
            echo "POSTGRES_USER=${PG_USER}"
            echo "POSTGRES_PASSWORD=${PG_PASSWORD}"
            echo "POSTGRES_DB=${PG_DB}"
          } >> "$GITHUB_ENV"

      # Start Valkey the same way and export VALKEY_URL/REDIS_URL. Harmless for
      # repos that stub the cache in test config — they just won't connect.
      - name: Start Valkey
        env:
          VALKEY_IMAGE: ${{ inputs.valkey-image }}
        run: |
          set -euo pipefail
          docker rm -f ci-valkey >/dev/null 2>&1 || true
          docker run -d --name ci-valkey -p 6379:6379 "$VALKEY_IMAGE"
          for i in $(seq 1 30); do
            if docker exec ci-valkey sh -c 'valkey-cli ping || redis-cli ping' >/dev/null 2>&1; then
              echo "valkey ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::valkey did not become ready in 30s"
              docker logs ci-valkey || true
              exit 1
            fi
            sleep 1
          done
          VK_HOST=localhost
          if [ -f /.dockerenv ]; then
            SELF="$(cat /etc/hostname)"
            NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$SELF" 2>/dev/null | head -n1 || true)"
            if [ -n "$NET" ]; then
              docker network connect "$NET" ci-valkey
              VK_HOST="$(docker inspect -f "{{(index .NetworkSettings.Networks \"$NET\").IPAddress}}" ci-valkey)"
              echo "containerized runner: reaching valkey at ${VK_HOST}:6379 via network ${NET}"
            fi
          fi
          {
            echo "VALKEY_URL=redis://${VK_HOST}:6379"
            echo "REDIS_URL=redis://${VK_HOST}:6379"
          } >> "$GITHUB_ENV"

      - name: Ecto setup
        if: inputs.run-ecto-setup
        run: mix ecto.create && mix ecto.migrate

      - name: Test
        run: mix test

      # Tear the containers down on self-hosted runners, where the workspace
      # persists between jobs. always() so a failed/cancelled step still cleans
      # up and the next run starts from a clean slate.
      - name: Stop Postgres
        if: always()
        run: docker rm -f ci-postgres >/dev/null 2>&1 || true

      - name: Stop Valkey
        if: always()
        run: docker rm -f ci-valkey >/dev/null 2>&1 || true
