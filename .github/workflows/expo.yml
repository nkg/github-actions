name: Expo

# Expo / React Native CI: install, lint, typecheck, test, optional EAS build.
#
# Package-manager-agnostic. Defaults to Bun (unchanged for existing callers);
# pass `package-manager: npm` (or yarn/pnpm), or `use-mise: true` to install
# the toolchain from the repo's mise.toml (e.g. an mise-pinned Node + npm app).
# Per-step commands auto-derive from the package manager and can be overridden
# with the *-command inputs (escape hatch for non-standard scripts).

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Package manager: bun | npm | yarn | pnpm"
        type: string
        default: "bun"
      use-mise:
        description: "Install the toolchain via mise (reads the repo's mise.toml — Node, and Bun if pinned) instead of setup-bun/setup-node. Overrides bun-version/node-version."
        type: boolean
        default: false
      bun-version:
        description: "Bun version (only when package-manager is bun and use-mise is false)"
        type: string
        default: "latest"
      node-version:
        description: "Node version (only when package-manager is npm/yarn/pnpm and use-mise is false)"
        type: string
        default: "lts/*"
      working-directory:
        description: "Directory containing app.json / app.config.ts"
        type: string
        default: "."
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      install-command:
        description: "Override the install command (empty = derive from package-manager)"
        type: string
        default: ""
      run-lint:
        description: "Run lint"
        type: boolean
        default: true
      lint-command:
        description: "Override the lint command (empty = `<pm> run lint`)"
        type: string
        default: ""
      run-typecheck:
        description: "Run typecheck"
        type: boolean
        default: true
      typecheck-command:
        description: "Override the typecheck command (empty = `<pm-exec> tsc --noEmit`)"
        type: string
        default: ""
      run-tests:
        description: "Run tests"
        type: boolean
        default: true
      test-command:
        description: "Override the test command (empty = `bun test`, or `<pm> test` for npm/yarn/pnpm)"
        type: string
        default: ""
      run-eas-build:
        description: "Trigger an EAS build (requires EXPO_TOKEN secret)"
        type: boolean
        default: false
      eas-platform:
        description: "EAS build platform: android, ios, or all"
        type: string
        default: "all"
      eas-profile:
        description: "EAS build profile (eas.json)"
        type: string
        default: "preview"
      eas-non-interactive:
        description: "Pass --non-interactive to eas build"
        type: boolean
        default: true
    secrets:
      EXPO_TOKEN:
        description: "Expo access token (required only when run-eas-build is true)"
        required: false

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve toolchain
        id: tc
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            bun)  run="bun run"; exec="bunx";            install="bun install --frozen-lockfile"; test="bun test";  lock="bun.lockb";         cache="$HOME/.bun/install/cache" ;;
            npm)  run="npm run"; exec="npx --no-install"; install="npm ci";                        test="npm test";  lock="package-lock.json"; cache="$HOME/.npm" ;;
            yarn) run="yarn";    exec="yarn";             install="yarn install --frozen-lockfile"; test="yarn test"; lock="yarn.lock";        cache="$HOME/.cache/yarn" ;;
            pnpm) run="pnpm run"; exec="pnpm exec";       install="pnpm install --frozen-lockfile"; test="pnpm test"; lock="pnpm-lock.yaml";   cache="$HOME/.local/share/pnpm/store" ;;
            *) echo "::error::unsupported package-manager: $PM (expected bun|npm|yarn|pnpm)"; exit 1 ;;
          esac
          {
            echo "install=$install"
            echo "lint=$run lint"
            echo "typecheck=$exec tsc --noEmit"
            echo "test=$test"
            echo "lock=$lock"
            echo "cache_path=$cache"
          } >> "$GITHUB_OUTPUT"

      # Full path + floating major tag: a relative ./.github/actions path
      # inside a reusable resolves against the consumer's checkout, not this
      # repo. The composite installs mise, caches the tool dir, and runs
      # `mise install` against the consumer's mise config.
      - name: Setup mise toolchain
        if: inputs.use-mise
        uses: nkg/github-actions/.github/actions/setup-mise@v2
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Bun
        if: ${{ !inputs.use-mise && inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Enable corepack
        if: ${{ !inputs.use-mise && (inputs.package-manager == 'yarn' || inputs.package-manager == 'pnpm') }}
        run: corepack enable

      - name: Setup Node
        if: ${{ !inputs.use-mise && inputs.package-manager != 'bun' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tc.outputs.lock }}

      # The bun/node setup actions above cache the package store themselves;
      # the mise path has no such action, so cache the resolved package
      # manager's download dir explicitly (keyed on whichever lockfile exists).
      - name: Cache package downloads (mise path)
        if: inputs.use-mise
        uses: actions/cache@v5
        with:
          path: ${{ steps.tc.outputs.cache_path }}
          key: mise-${{ inputs.package-manager }}-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            mise-${{ inputs.package-manager }}-${{ runner.os }}-

      - name: Install
        run: ${{ inputs.install-command != '' && inputs.install-command || steps.tc.outputs.install }}

      - name: Lint
        if: inputs.run-lint
        run: ${{ inputs.lint-command != '' && inputs.lint-command || steps.tc.outputs.lint }}

      - name: Typecheck
        if: inputs.run-typecheck
        run: ${{ inputs.typecheck-command != '' && inputs.typecheck-command || steps.tc.outputs.typecheck }}

      - name: Test
        if: inputs.run-tests
        run: ${{ inputs.test-command != '' && inputs.test-command || steps.tc.outputs.test }}

      - name: Setup EAS
        if: inputs.run-eas-build
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build
        if: inputs.run-eas-build
        run: |
          ARGS="--platform ${{ inputs.eas-platform }} --profile ${{ inputs.eas-profile }}"
          if [ "${{ inputs.eas-non-interactive }}" = "true" ]; then
            ARGS="$ARGS --non-interactive"
          fi
          # Word-splitting is intentional — ARGS is a space-separated flag string.
          # shellcheck disable=SC2086
          eas build $ARGS
