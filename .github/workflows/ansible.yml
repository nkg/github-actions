name: Ansible

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version (for ansible + ansible-lint). Ignored when use-mise is true."
        type: string
        default: "3.12"
      use-mise:
        description: |
          Install Python via mise (reads the consumer's mise.toml) instead of
          actions/setup-python. Overrides python-version. ansible +
          ansible-lint are still pip-installed into that interpreter.
        type: boolean
        default: false
      working-directory:
        description: "Repo subdirectory containing playbooks"
        type: string
        default: "."
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      run-lint:
        description: "Run ansible-lint"
        type: boolean
        default: true
      run-syntax-check:
        description: "Run ansible-playbook --syntax-check"
        type: boolean
        default: true
      playbooks:
        description: "Newline-separated list of playbooks to syntax-check"
        type: string
        default: ""
      requirements-file:
        description: "Optional requirements.yml for ansible-galaxy install"
        type: string
        default: ""

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      # Full path + floating major tag: a relative ./.github/actions path
      # inside a reusable resolves against the consumer's checkout, not this
      # repo. Installs mise, caches the tool dir, runs `mise install`.
      - name: Setup mise toolchain
        if: inputs.use-mise
        uses: nkg/github-actions/.github/actions/setup-mise@v2
        with:
          working-directory: ${{ inputs.working-directory }}

      - uses: actions/setup-python@v6
        if: ${{ !inputs.use-mise }}
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      # setup-python caches pip downloads itself; the mise path has no such
      # action, so cache the pip download dir explicitly.
      - name: Cache pip downloads (mise path)
        if: inputs.use-mise
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: mise-pip-${{ runner.os }}-${{ hashFiles('**/.mise.toml', '**/mise.toml', '**/.tool-versions') }}
          restore-keys: |
            mise-pip-${{ runner.os }}-

      - name: Install ansible + ansible-lint
        run: pip install ansible ansible-lint

      - name: Install collections
        if: inputs.requirements-file != ''
        run: ansible-galaxy install -r ${{ inputs.requirements-file }}

      - name: ansible-lint
        if: inputs.run-lint
        run: ansible-lint

      - name: Syntax check
        if: inputs.run-syntax-check && inputs.playbooks != ''
        run: |
          while IFS= read -r playbook; do
            [ -z "$playbook" ] && continue
            echo "::group::syntax-check $playbook"
            ansible-playbook --syntax-check "$playbook"
            echo "::endgroup::"
          done <<< "${{ inputs.playbooks }}"
