name: Container security scan (Trivy)

# Reusable scan of every image referenced by a compose file (or a literal
# image-list input). Generalised from sproncy-distillery's security-scan.yml.
# Disk-hygiene: removes each image from the runner after scanning, since on
# the self-hosted fleet disk space is the binding constraint.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      compose-file:
        description: "Path to docker-compose.yml to extract `image:` refs from. Ignored when image-list is set."
        type: string
        default: "docker-compose.yml"
      image-list:
        description: "Newline-separated image refs. Overrides compose-file when non-empty."
        type: string
        default: ""
      severity:
        description: "Comma-separated severities that fail the build"
        type: string
        default: "CRITICAL,HIGH"
      ignore-unfixed:
        description: "Skip vulnerabilities that don't yet have a fix"
        type: boolean
        default: true
      upload-sarif:
        description: "Upload SARIF to the GitHub Security tab. Auto-skipped on pull_request (fork PRs can't write security-events)."
        type: boolean
        default: true
      trivy-action-version:
        description: "Pinned version of aquasecurity/trivy-action"
        type: string
        default: "0.36.0"
      timeout-minutes:
        type: number
        default: 20

jobs:
  extract-images:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      images: ${{ steps.parse.outputs.images }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image list
        id: parse
        env:
          IMAGE_LIST: ${{ inputs.image-list }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGE_LIST" ]; then
            # Strip blank lines, dedupe.
            IMAGES=$(printf '%s\n' "$IMAGE_LIST" \
              | grep -v '^[[:space:]]*$' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "::error::compose file not found: $COMPOSE_FILE"
              exit 1
            fi
            # Match indented `image:` lines. Services with `build:` (no image)
            # are skipped — they're built from source elsewhere in CI.
            IMAGES=$(grep -E '^\s+image:' "$COMPOSE_FILE" \
              | sed 's/.*image:\s*//' \
              | tr -d "\"'" \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "Will scan:"
          echo "$IMAGES" | jq -r '.[]'

  trivy:
    needs: extract-images
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Declaring `permissions:` drops the default scope, so every needed
    # perm has to be listed explicitly. security-events:write +
    # actions:read are required by github/codeql-action/upload-sarif.
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.extract-images.outputs.images) }}
    steps:
      - uses: actions/checkout@v6

      - name: Trivy scan (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}

      - name: Compute safe filename
        if: always() && inputs.upload-sarif && github.event_name != 'pull_request'
        id: safename
        env:
          IMG: ${{ matrix.image }}
        run: echo "name=$(echo "$IMG" | tr '/:' '--')" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF)
        if: always() && inputs.upload-sarif && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ steps.safename.outputs.name }}.sarif
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ steps.safename.outputs.name }}.sarif

      - name: Reclaim disk
        if: always()
        env:
          IMG: ${{ matrix.image }}
        run: docker image rm "$IMG" 2>/dev/null || true
