name: Container security scan (Trivy)

# Reusable scan of every image referenced by a compose file (or a literal
# image-list input). Generalised from sproncy-distillery's security-scan.yml.
# Disk-hygiene: removes each image from the runner after scanning, since on
# the self-hosted fleet disk space is the binding constraint.
#
# Caller permissions — grant only what the run actually uses:
#
#   upload-sarif: false        upload-sarif: true (default)
#   ------------------------   ---------------------------------
#   permissions:               permissions:
#     contents: read             contents: read
#                                actions: read
#                                security-events: write
#
# The `trivy` job deliberately declares NO `permissions:` block, so it
# inherits whatever the caller granted. GitHub validates a called workflow's
# declared job permissions statically at run creation, BEFORE any `if:` is
# evaluated — so declaring `security-events: write` here, even though every
# SARIF step is guarded by `if: inputs.upload-sarif`, would force every
# caller to grant it. Consumers on private repos without Advanced Security
# pass `upload-sarif: false` precisely because the upload 403s, and were
# being made to authorise a permission the run never used.
#
# Unlike trivy-repo.yml, the SARIF work is NOT split into a separate job.
# There it is a second checkout; here it would be a second pull of every
# matrix image, and this workflow exists on a fleet where disk is the
# binding constraint (see above). The step-level `if:` guards already skip
# the upload work, so the omission alone is what makes the permission
# optional — the split was never the load-bearing part of that fix.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      compose-file:
        description: "Path to docker-compose.yml to extract `image:` refs from. Ignored when image-list is set."
        type: string
        default: "docker-compose.yml"
      image-list:
        description: "Newline-separated image refs. Overrides compose-file when non-empty."
        type: string
        default: ""
      severity:
        description: "Comma-separated severities that fail the build"
        type: string
        default: "CRITICAL,HIGH"
      ignore-unfixed:
        description: "Skip vulnerabilities that don't yet have a fix"
        type: boolean
        default: true
      upload-sarif:
        description: |
          Upload SARIF to the GitHub Security tab. Auto-skipped on
          pull_request (fork PRs can't write security-events). When true the
          caller must grant `security-events: write` + `actions: read`; when
          false `contents: read` alone is enough (see the header).
        type: boolean
        default: true
      trivy-action-version:
        description: "Pinned version of aquasecurity/trivy-action"
        type: string
        default: "0.36.0"
      timeout-minutes:
        type: number
        default: 20

jobs:
  extract-images:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      images: ${{ steps.parse.outputs.images }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve image list
        id: parse
        env:
          IMAGE_LIST: ${{ inputs.image-list }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGE_LIST" ]; then
            # Strip blank lines, dedupe.
            IMAGES=$(printf '%s\n' "$IMAGE_LIST" \
              | grep -v '^[[:space:]]*$' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "::error::compose file not found: $COMPOSE_FILE"
              exit 1
            fi
            # Match indented `image:` lines. Services with `build:` (no image)
            # are skipped — they're built from source elsewhere in CI.
            IMAGES=$(grep -E '^\s+image:' "$COMPOSE_FILE" \
              | sed 's/.*image:\s*//' \
              | tr -d "\"'" \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "Will scan:"
          echo "$IMAGES" | jq -r '.[]'

  trivy:
    needs: extract-images
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # No `permissions:` block on purpose — it inherits the caller's grant.
    # See the header: a static declaration here is validated before the
    # SARIF steps' `if:` guards are evaluated, so it would make
    # `security-events: write` mandatory for every caller including those
    # passing `upload-sarif: false`. github/codeql-action/upload-sarif needs
    # security-events:write + actions:read; the caller supplies them when it
    # opts in.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.extract-images.outputs.images) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trivy scan (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}

      - name: Compute safe filename
        if: always() && inputs.upload-sarif && github.event_name != 'pull_request'
        id: safename
        env:
          IMG: ${{ matrix.image }}
        run: echo "name=$(echo "$IMG" | tr '/:' '--')" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF)
        if: always() && inputs.upload-sarif && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ steps.safename.outputs.name }}.sarif
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}

      - name: Upload SARIF
        if: always() && inputs.upload-sarif && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-${{ steps.safename.outputs.name }}.sarif

      - name: Reclaim disk
        if: always()
        env:
          IMG: ${{ matrix.image }}
        run: docker image rm "$IMG" 2>/dev/null || true
