name: Claude code review

# Reusable wrapper around anthropics/claude-code-action for automated PR
# reviews. Consumer stub triggers on pull_request and calls this workflow.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Defaults to the self-hosted pool. Public/open-source repos opt out by passing '[\"ubuntu-latest\"]'."
        type: string
        default: '["self-hosted", "linux", "x64"]'
      timeout-minutes:
        type: number
        default: 30
      filter-authors:
        description: |
          Optional comma-separated list of PR authors to filter on (others skipped).
          Example: "external-contributor,new-developer". Empty = review every PR.
        type: string
        default: ""
      filter-first-time-only:
        description: "Only review PRs from FIRST_TIME_CONTRIBUTOR / FIRST_TIMER"
        type: boolean
        default: false
      plugin-marketplace:
        type: string
        default: "https://github.com/anthropics/claude-code.git"
      plugins:
        type: string
        default: "code-review@claude-code-plugins"
      prompt:
        description: "Override the default code-review prompt"
        type: string
        default: ""
      claude-args:
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    # Author/contributor filter is opt-in. By default every PR gets reviewed.
    # Dependabot PRs are always skipped: they run in a restricted context with
    # no access to Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN arrives empty and
    # the action errors out — and we don't want to spend Claude review on bumps.
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' && (
        (inputs.filter-authors == '' && !inputs.filter-first-time-only) ||
        contains(inputs.filter-authors, github.event.pull_request.user.login) ||
        (inputs.filter-first-time-only && (github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' || github.event.pull_request.author_association == 'FIRST_TIMER'))
      )
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # `claude-code-action` posts review comments back on the PR, so it
    # needs write on pull-requests and issues. The `claude.yml` (bot)
    # workflow stays at `read` because that one routes comments through
    # the OAuth-token-scoped path inside the action, not the workflow's
    # GITHUB_TOKEN. Mirrors the working sproncy-accord local copy.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # claude-code-action self-validates that the workflow file
          # on the PR matches the version on the default branch
          # (security control — stops PRs from rewriting the review
          # prompt). Consumers can `paths-ignore` their wrapper file
          # to dodge the failure on benign edits to it.
          fetch-depth: 1

      - name: Run Claude Code Review
        # Advisory check: a crash in the upstream action (e.g. the Claude
        # Code 2.1.98 "directory mismatch for tsconfig.json" SDK bug,
        # anthropics/claude-code-action#1205) must never block a PR. The
        # review posts its findings as comments; the job status is not a gate.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ inputs.plugin-marketplace }}
          plugins: ${{ inputs.plugins }}
          prompt: ${{ inputs.prompt != '' && inputs.prompt || format('/code-review:code-review {0}/pull/{1}', github.repository, github.event.pull_request.number) }}
          claude_args: ${{ inputs.claude-args }}
