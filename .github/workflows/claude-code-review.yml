name: Claude code review

# Reusable wrapper around anthropics/claude-code-action for automated PR
# reviews. Consumer stub triggers on pull_request and calls this workflow.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Defaults to the self-hosted pool. Public/open-source repos opt out by passing '[\"ubuntu-latest\"]'."
        type: string
        default: '["self-hosted", "linux", "x64"]'
      timeout-minutes:
        type: number
        default: 30
      filter-authors:
        description: |
          Optional comma-separated list of PR authors to filter on (others skipped).
          Example: "external-contributor,new-developer". Empty = review every PR.
        type: string
        default: ""
      filter-first-time-only:
        description: "Only review PRs from FIRST_TIME_CONTRIBUTOR / FIRST_TIMER"
        type: boolean
        default: false
      plugin-marketplace:
        description: "Optional plugin marketplace. Empty by default — the code-review plugin is broken on current Claude Code (spawns a non-existent claude-haiku agent), so we use a direct review prompt instead."
        type: string
        default: ""
      plugins:
        description: "Optional plugins. Empty by default (see plugin-marketplace)."
        type: string
        default: ""
      prompt:
        description: "Override the default code-review prompt"
        type: string
        default: ""
      claude-args:
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    # Author/contributor filter is opt-in. By default every PR gets reviewed.
    # Dependabot PRs are always skipped: they run in a restricted context with
    # no access to Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN arrives empty and
    # the action errors out — and we don't want to spend Claude review on bumps.
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' && (
        (inputs.filter-authors == '' && !inputs.filter-first-time-only) ||
        contains(inputs.filter-authors, github.event.pull_request.user.login) ||
        (inputs.filter-first-time-only && (github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' || github.event.pull_request.author_association == 'FIRST_TIMER'))
      )
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # `claude-code-action` posts review comments back on the PR, so it
    # needs write on pull-requests and issues. The `claude.yml` (bot)
    # workflow stays at `read` because that one routes comments through
    # the OAuth-token-scoped path inside the action, not the workflow's
    # GITHUB_TOKEN. Mirrors the working sproncy-accord local copy.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # claude-code-action self-validates that the workflow file
          # on the PR matches the version on the default branch
          # (security control — stops PRs from rewriting the review
          # prompt). Consumers can `paths-ignore` their wrapper file
          # to dodge the failure on benign edits to it.
          fetch-depth: 1

      - name: Run Claude Code Review
        # Advisory check: a crash in the upstream action (e.g. the Claude
        # Code 2.1.98 "directory mismatch for tsconfig.json" SDK bug,
        # anthropics/claude-code-action#1205) must never block a PR. The
        # review posts its findings as comments; the job status is not a gate.
        continue-on-error: true
        uses: anthropics/claude-code-action@0cb4f3e5e764d2e00407d29b6bf0aa9df0976d88 # v1.0.146
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ inputs.plugin-marketplace }}
          plugins: ${{ inputs.plugins }}
          # Direct review prompt (NOT the /code-review plugin, which is broken
          # on Claude Code 2.1.x — it spawns a non-existent claude-haiku agent
          # and posts nothing). Single line so it survives format(); a caller
          # passing `prompt` overrides it.
          prompt: ${{ inputs.prompt != '' && inputs.prompt || format('Review pull request {0}#{1} for bugs, security issues, performance problems, and missing test coverage. Follow the repo''s CLAUDE.md conventions if present. Post each specific problem as an inline comment with the mcp__github_inline_comment__create_inline_comment tool, and leave one short top-level summary via `gh pr comment`. Only flag real issues; if there are none, say so briefly.', github.repository, github.event.pull_request.number) }}
          # Without an explicit --allowedTools the inline-comment MCP tool is
          # denied, so Claude runs but posts nothing ("No buffered inline
          # comments" + permission_denials). Default to Anthropic's documented
          # PR-review tool set (examples/pr-review-comprehensive.yml); a caller
          # passing claude-args overrides it entirely.
          claude_args: ${{ inputs.claude-args != '' && inputs.claude-args || '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"' }}
