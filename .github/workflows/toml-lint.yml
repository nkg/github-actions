name: TOML lint

# Two independent checks:
#   1. taplo fmt --check — formatting against the repo's taplo config (or defaults).
#   2. tomllib parse — every .toml file must round-trip through Python's tomllib.
# Lifted from Regularmusic/komodo.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      taplo-version:
        # renovate: datasource=github-releases depName=tamasfe/taplo
        type: string
        default: "0.10.0"
      run-fmt-check:
        type: boolean
        default: true
      run-parse-check:
        type: boolean
        default: true
      python-version:
        type: string
        default: "3.12"
      paths:
        description: |
          Whitespace-separated glob list for the parse check. Default
          '**/*.toml' walks the whole tree (bash globstar enabled).
        type: string
        default: "**/*.toml"

jobs:
  taplo-fmt:
    if: inputs.run-fmt-check
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install taplo
        env:
          VERSION: ${{ inputs.taplo-version }}
        run: |
          set -euo pipefail
          # taplo dropped the `-full` asset suffix at 0.10. If you bump
          # past 0.11 verify the asset filename first.
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/${VERSION}/taplo-linux-x86_64.gz" \
            | gunzip > /tmp/taplo
          sudo install -m 0755 /tmp/taplo /usr/local/bin/taplo
          taplo --version

      - run: taplo fmt --check

  tomllib-parse:
    if: inputs.run-parse-check
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # uv provisions the interpreter (setup-python can't on newer
      # self-hosted runners); tomllib is stdlib so nothing is pip-installed.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Parse all TOML
        env:
          PATHS: ${{ inputs.paths }}
          PYVER: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=()
          # Word-splitting on $PATHS is intentional — input is space-separated globs.
          # shellcheck disable=SC2086
          for f in $PATHS; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no TOML files matched '$PATHS'"
            exit 0
          fi
          uv run --no-project --python "$PYVER" python - "${files[@]}" <<'EOF'
          import sys
          import tomllib

          fail = 0
          for path in sys.argv[1:]:
              try:
                  with open(path, "rb") as fh:
                      tomllib.load(fh)
              except Exception as exc:
                  print(f"::error file={path}::TOML parse failed: {exc}")
                  fail = 1
          sys.exit(fail)
          EOF
