name: Auto-assign

# Reusable: assigns new issues and PRs to one or more users.
# Consumer stub triggers on `issues: [opened]` and `pull_request: [opened]`
# and calls this workflow with `secrets: inherit`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      assignees:
        description: "Comma- or newline-separated GitHub usernames to assign"
        type: string
        default: "nkg"
      number-of-assignees:
        description: "Random subset to pick from `assignees` (0 = all)"
        type: number
        default: 0

jobs:
  auto-assign:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign
        uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011 # v4.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ inputs.assignees }}
          numOfAssignee: ${{ inputs.number-of-assignees }}
