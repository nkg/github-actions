name: Docker build & push

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name (without registry, e.g. 'my-org/my-app')"
        type: string
        required: true
      registry:
        description: "Registry to push to"
        type: string
        default: "ghcr.io"
      context:
        description: "Build context"
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      platforms:
        description: "Comma-separated platforms"
        type: string
        default: "linux/amd64"
      push:
        description: "Push the image (false = build only, useful for PRs)"
        type: boolean
        default: true
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      build-args:
        description: "Newline-separated KEY=VALUE build args"
        type: string
        default: ""
      build-secrets:
        description: |
          Newline-separated id=value pairs forwarded to BuildKit as
          --mount=type=secret. Use for private-deps tokens consumed inside the
          Dockerfile, e.g. a github_token minted via setup-deps-reader/setup-token
          in the caller. Build secrets are not persisted in image layers.
        type: string
        default: ""
      deps-reader-client-id:
        description: |
          GitHub App client ID for private-module access *inside the build*.
          When set, a scoped installation token is minted (via setup-token)
          and injected as the `github_token` BuildKit secret, so a Dockerfile
          that does `--mount=type=secret,id=github_token ... go mod download`
          (or equivalent) can resolve private modules without the caller
          having to mint the token itself. Merged with any `build-secrets`.
          Pair with deps-reader-repositories + the DEPS_READER_PRIVATE_KEY
          secret. Empty = no token minted (existing behaviour).
        type: string
        default: ""
      deps-reader-repositories:
        description: "Comma-separated repo names (no owner) the minted token is scoped to. Required when deps-reader-client-id is set."
        type: string
        default: ""
      run-trivy-scan:
        description: "Scan the built image with Trivy after push. Requires push: true."
        type: boolean
        default: false
      trivy-severity:
        description: "Trivy severities that fail the build"
        type: string
        default: "CRITICAL,HIGH"
      trivy-ignore-unfixed:
        type: boolean
        default: true
      sign-image:
        description: "Sign the pushed image with cosign keyless OIDC. Requires push: true."
        type: boolean
        default: false
      generate-sbom:
        description: "Generate an SPDX SBOM artifact via anchore/sbom-action. Requires push: true."
        type: boolean
        default: false
    secrets:
      registry-username:
        description: "Registry username (defaults to github.actor when unset)"
        required: false
      registry-password:
        description: "Registry password / token (defaults to GITHUB_TOKEN when unset)"
        required: false
      DEPS_READER_PRIVATE_KEY:
        description: "Private key for the deps-reader GitHub App (required when deps-reader-client-id is set)"
        required: false

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # id-token: write is needed for cosign keyless OIDC. Always declaring
      # it is harmless when sign-image is false.
      id-token: write
      # security-events: write lets the Trivy SARIF reach the Security tab.
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Mint a scoped App token for private modules pulled during the build.
      # setup-token (not setup-deps-reader) because we only need the token as
      # an output to feed BuildKit — the build runs in its own container and
      # doesn't read the runner's host git config. The token is masked, so it
      # never appears in logs even though it flows through the build secret.
      - name: Mint private-deps token
        id: deps-reader
        if: inputs.deps-reader-client-id != ''
        uses: nkg/github-actions/.github/actions/setup-token@v2
        with:
          app-client-id: ${{ inputs.deps-reader-client-id }}
          app-private-key: ${{ secrets.DEPS_READER_PRIVATE_KEY }}
          repositories: ${{ inputs.deps-reader-repositories }}
          permission-contents: read

      - name: Login to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          # Caller-supplied build-secrets plus, when deps-reader is configured,
          # the minted token as `github_token`. Empty lines (either side unset)
          # are ignored by build-push-action.
          secrets: |
            ${{ inputs.build-secrets }}
            ${{ inputs.deps-reader-client-id != '' && format('github_token={0}', steps.deps-reader.outputs.token) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cosign + Trivy + SBOM operate on the pushed image by digest. When
      # push: false (PR builds), nothing reached the registry, so they
      # short-circuit with a notice rather than failing.

      - name: Sign with cosign
        if: inputs.sign-image && inputs.push
        uses: sigstore/cosign-installer@v3
      - name: Run cosign sign
        if: inputs.sign-image && inputs.push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign every tag at the same digest. Keyless OIDC: cosign picks up
          # GitHub's OIDC token automatically when id-token: write is set.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "signing $tag@$DIGEST"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Trivy scan (fail on findings)
        if: inputs.run-trivy-scan && inputs.push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}

      - name: Trivy scan (SARIF)
        if: inputs.run-trivy-scan && inputs.push && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}

      - name: Upload SARIF
        if: inputs.run-trivy-scan && inputs.push && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Generate SBOM
        if: inputs.generate-sbom && inputs.push
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.registry }}/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30
