name: Docker build & push

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name (without registry, e.g. 'my-org/my-app')"
        type: string
        required: true
      registry:
        description: "Registry to push to"
        type: string
        default: "ghcr.io"
      context:
        description: "Build context"
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      platforms:
        description: "Comma-separated platforms"
        type: string
        default: "linux/amd64"
      push:
        description: "Push the image (false = build only, useful for PRs)"
        type: boolean
        default: true
      runs-on:
        description: "Runner label(s)"
        type: string
        default: "ubuntu-latest"
      build-args:
        description: "Newline-separated KEY=VALUE build args"
        type: string
        default: ""
    secrets:
      registry-username:
        description: "Registry username (defaults to github.actor when unset)"
        required: false
      registry-password:
        description: "Registry password / token (defaults to GITHUB_TOKEN when unset)"
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
