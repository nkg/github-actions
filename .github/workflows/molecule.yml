name: Molecule

# Matrix-driven molecule test runner. Replaces the per-role copy-paste
# pattern (one job per role) commonly seen in Ansible role-heavy repos.
# Lifted from Regularmusic/iac which had 14 near-identical jobs.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      python-version:
        type: string
        default: "3.12"
      roles:
        description: "Newline- or comma-separated list of role names under roles-dir"
        type: string
        required: true
      roles-dir:
        description: "Parent directory holding the molecule-managed roles"
        type: string
        default: "ansible/roles"
      requirements-file:
        description: |
          Optional ansible-galaxy requirements file. If the file doesn't exist
          the step is skipped, so it's safe to leave at the default.
        type: string
        default: "ansible/requirements.yml"
      molecule-driver:
        description: "Driver extra for molecule-plugins (docker | podman | …)"
        type: string
        default: "docker"
      molecule-scenario:
        description: "Scenario subdir under each role/molecule/"
        type: string
        default: "default"
      timeout-minutes:
        type: number
        default: 30

jobs:
  prepare-matrix:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    outputs:
      roles: ${{ steps.parse.outputs.roles }}
    steps:
      - name: Build role matrix
        id: parse
        env:
          ROLES: ${{ inputs.roles }}
        run: |
          set -euo pipefail
          # Accept comma- or newline-separated; dedupe and drop blanks.
          arr=$(printf '%s\n' "$ROLES" \
            | tr ',' '\n' \
            | sed 's/[[:space:]]*//g' \
            | grep -v '^$' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "roles=$arr" >> "$GITHUB_OUTPUT"
          echo "Will test roles:"
          echo "$arr" | jq -r '.[]'

  test:
    needs: prepare-matrix
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.prepare-matrix.outputs.roles) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # uv provisions Python and runs molecule in an ephemeral uvx
      # environment — no setup-python (which can't provision Python on newer
      # self-hosted runners), no global pip.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install galaxy collections
        env:
          REQS: ${{ inputs.requirements-file }}
          PYVER: ${{ inputs.python-version }}
        run: |
          if [ -n "$REQS" ] && [ -f "$REQS" ]; then
            uvx --python "$PYVER" --from ansible-core ansible-galaxy install -r "$REQS"
          else
            echo "no requirements file at '$REQS' — skipping"
          fi

      - name: Molecule test (${{ matrix.role }})
        working-directory: ${{ inputs.roles-dir }}/${{ matrix.role }}
        env:
          DRIVER: ${{ inputs.molecule-driver }}
          PYVER: ${{ inputs.python-version }}
          SCENARIO: ${{ inputs.molecule-scenario }}
        run: uvx --python "$PYVER" --with ansible-core --with "molecule-plugins[$DRIVER]" molecule test -s "$SCENARIO"
