name: Lint workflows

# Reusable: actionlint + yamllint over the consumer's .github/ tree.
# Generalised from sproncy-distillery/lint-workflows.yml.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      actionlint-version:
        # renovate: datasource=github-releases depName=rhysd/actionlint
        type: string
        default: "1.7.7"
      actionlint-ignore:
        description: "Newline-separated -ignore patterns. Each becomes one `-ignore PATTERN` arg."
        type: string
        default: ""
      run-yamllint:
        type: boolean
        default: true
      yamllint-paths:
        description: "Whitespace-separated paths to yamllint"
        type: string
        default: ".github/"

jobs:
  actionlint:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$VERSION"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        env:
          IGNORES: ${{ inputs.actionlint-ignore }}
        run: |
          set -euo pipefail
          args=(-color)
          while IFS= read -r ig; do
            [ -z "$ig" ] && continue
            args+=(-ignore "$ig")
          done <<< "$IGNORES"
          actionlint "${args[@]}"

  yamllint:
    if: inputs.run-yamllint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Install yamllint via uv. actions/setup-python can't provision Python on
      # newer runners (e.g. Debian 13 self-hosted: "3.12 not found"); uv is
      # self-contained. Mirrors the actionlint install step above.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run yamllint
        env:
          PATHS: ${{ inputs.yamllint-paths }}
        run: |
          # Word-splitting on PATHS is intentional — input is whitespace-separated.
          # shellcheck disable=SC2086
          uvx yamllint $PATHS
