name: Lint workflows

# Reusable: actionlint + yamllint over the consumer's .github/ tree.
# Generalised from sproncy-distillery/lint-workflows.yml.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Defaults to the self-hosted pool. Ignored for public repos, which always run on '[\"ubuntu-latest\"]'."
        type: string
        # Self-hosted by default since 2026-09-20. Actions credits are
        # exhausted across HordiaLabs, Sproncy and Regularmusic, so a hosted
        # job fails ~2s after queueing with "The job was not started because
        # recent account payments have failed or your spending limit needs to
        # be increased". Consumers that relied on this default were therefore
        # running nothing at all: 1 call (Sproncy/agent-skills).
        #
        # Every other consumer already passes `runs-on` explicitly, so this
        # changes behaviour only for those that did not.
        #
        # Public repos never use this input. The job's runs-on forces
        # ["ubuntu-latest"] whenever github.event.repository.visibility is
        # "public": fork PRs on a self-hosted pool are the hazard GitHub
        # warns about, hosted minutes are free there, and a public caller
        # that omits `runs-on` would otherwise queue for 24h on a pool with
        # no runner registered. An event whose payload carries no
        # repository object falls back to this input, so public callers
        # should still pass a hosted `runs-on` as well.
        default: '["self-hosted", "linux", "x64"]'
      actionlint-version:
        type: string
        # renovate: datasource=github-releases depName=rhysd/actionlint
        default: "1.7.12"
      actionlint-ignore:
        description: "Newline-separated -ignore patterns. Each becomes one `-ignore PATTERN` arg."
        type: string
        default: ""
      run-yamllint:
        type: boolean
        default: true
      yamllint-paths:
        description: "Whitespace-separated paths to yamllint"
        type: string
        default: ".github/"

jobs:
  actionlint:
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '["ubuntu-latest"]' || inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$VERSION"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        env:
          IGNORES: ${{ inputs.actionlint-ignore }}
        run: |
          set -euo pipefail
          args=(-color)
          while IFS= read -r ig; do
            [ -z "$ig" ] && continue
            args+=(-ignore "$ig")
          done <<< "$IGNORES"
          actionlint "${args[@]}"

  yamllint:
    if: inputs.run-yamllint
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '["ubuntu-latest"]' || inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install yamllint via uv. actions/setup-python can't provision Python on
      # newer runners (e.g. Debian 13 self-hosted: "3.12 not found"); uv is
      # self-contained. Mirrors the actionlint install step above.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run yamllint
        env:
          PATHS: ${{ inputs.yamllint-paths }}
        run: |
          # Word-splitting on PATHS is intentional — input is whitespace-separated.
          # shellcheck disable=SC2086
          uvx yamllint $PATHS
