name: Self-test

on:
  push:
    branches: [main]
  pull_request:

# This repo is PUBLIC, so its own CI runs on GitHub-hosted runners, not the
# self-hosted pool: `pull_request` fires for fork PRs, and running untrusted
# PR code on self-hosted runners would let anyone execute on our infra
# (GitHub's documented self-hosted-on-public-repo risk). ubuntu-latest is
# also free + unlimited for public repos. Consumers still default to / can
# pass the self-hosted pool from their own (private) repos.
jobs:
  # Dogfood: lint this repo's workflows with our own reusable.
  lint:
    uses: ./.github/workflows/lint-workflows.yml
    with:
      runs-on: '["ubuntu-latest"]'
      yamllint-paths: ".github/ .yamllint.yml"

  composite-actions-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Validate composite action metadata
        run: |
          set -euo pipefail
          for action in .github/actions/*/action.yml; do
            echo "Checking $action"
            uv run --no-project --with pyyaml python -c \
              "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$action"
          done

  # Smoke-test the composite actions with this PR's code. Relative `uses:`
  # paths work here (unlike inside the reusables) because the checkout IS
  # this repo. setup-token / setup-deps-reader are excluded — they need a
  # GitHub App key, which fork PRs can't see.
  composite-actions-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup-mise
        uses: ./.github/actions/setup-mise
      - run: mise --version

      - name: setup-trivy
        uses: ./.github/actions/setup-trivy
      - run: trivy --version

      - name: setup-sops
        uses: ./.github/actions/setup-sops
      - run: sops --version && age --version

      # setup-cosign verifies itself (`cosign version` is its last step).
      - name: setup-cosign
        uses: ./.github/actions/setup-cosign

      - name: setup-go
        uses: ./.github/actions/setup-go
        with:
          working-directory: tests/fixtures/go
      - run: go version

  # Integration tests: run the reusable language workflows end-to-end against
  # tiny fixture projects. A local-path `uses:` runs the workflow from this
  # commit. Fixtures stay on the default (non-mise) toolchain paths — the
  # composite refs inside the reusables resolve to the released @v2 tag, so a
  # use-mise fixture would exercise released code rather than this PR's.
  integration-python-uv:
    uses: ./.github/workflows/python-uv.yml
    with:
      runs-on: '["ubuntu-latest"]'
      working-directory: tests/fixtures/python-uv
      upload-coverage: false

  integration-go:
    uses: ./.github/workflows/go.yml
    with:
      runs-on: '["ubuntu-latest"]'
      working-directory: tests/fixtures/go
      upload-coverage: false
      # Exercises the Postgres startup path: the readiness probe, the SELECT 1
      # gate, and the DATABASE_URL export. Without this the `Start Postgres`
      # block is gated off in every self-test job, so it shipped to every
      # consumer having never run in this repo's own CI — which is how a probe
      # that waited on the wrong server survived.
      #
      # It does NOT deterministically reproduce the initdb race (that is timing
      # dependent). What it does prove is that the probe works against a real
      # postgres image, rather than only against the entrypoint source.
      postgres-enabled: true

  integration-node-bun:
    uses: ./.github/workflows/node-bun.yml
    with:
      runs-on: '["ubuntu-latest"]'
      working-directory: tests/fixtures/node-bun

  # Regression test for the trivy-repo.yml permission fix (#49): a caller that
  # opts out of the SARIF upload must be able to run with `contents: read`
  # ALONE. Deliberately does NOT grant actions:read / security-events:write.
  #
  # This guards a genuinely non-obvious constraint. Called-workflow job
  # permissions are validated statically at run creation, before any `if:` is
  # evaluated, so it is not enough for the privileged job to be skipped — it
  # must not DECLARE the permissions either. The moment anyone adds a
  # `permissions:` block to trivy-repo.yml's `sarif-upload` job (an obvious
  # "hardening" tidy-up), every opted-out caller breaks. This job catches that
  # immediately: it dies at startup_failure rather than running.
  #
  # Note the PR run only exercises the `github.event_name != 'pull_request'`
  # half of the skip; the `upload-sarif: false` half is covered by the same
  # job on the post-merge push to main.
  integration-trivy-no-sarif:
    uses: ./.github/workflows/trivy-repo.yml
    permissions:
      contents: read
    with:
      runs-on: '["ubuntu-latest"]'
      scan-type: config
      upload-sarif: false
      # Fixtures vendor node_modules; nothing here is IaC we want to gate on.
      skip-dirs: tests/fixtures

  # Same regression test for container-security.yml, which had the identical
  # defect: a caller opting out of the SARIF upload must run with
  # `contents: read` ALONE. Deliberately does NOT grant actions:read /
  # security-events:write, so re-adding a `permissions:` block to that
  # workflow's trivy job fails here rather than in consumers.
  #
  # hello-world is used as the scan target because it's ~20kB and carries no
  # CRITICAL/HIGH findings, so this job tests the permission contract rather
  # than Trivy's verdict on some real image.
  integration-container-security-no-sarif:
    uses: ./.github/workflows/container-security.yml
    permissions:
      contents: read
    with:
      runs-on: '["ubuntu-latest"]'
      image-list: hello-world:latest
      upload-sarif: false
