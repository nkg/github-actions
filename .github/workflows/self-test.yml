name: Self-test

on:
  push:
    branches: [main]
  pull_request:

# This repo is PUBLIC, so its own CI runs on GitHub-hosted runners, not the
# self-hosted pool: `pull_request` fires for fork PRs, and running untrusted
# PR code on self-hosted runners would let anyone execute on our infra
# (GitHub's documented self-hosted-on-public-repo risk). ubuntu-latest is
# also free + unlimited for public repos. Consumers still default to / can
# pass the self-hosted pool from their own (private) repos.
jobs:
  # Dogfood: lint this repo's workflows with our own reusable.
  lint:
    uses: ./.github/workflows/lint-workflows.yml
    with:
      runs-on: '["ubuntu-latest"]'
      yamllint-paths: ".github/ .yamllint.yml"

  composite-actions-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate composite action metadata
        run: |
          for action in .github/actions/*/action.yml; do
            echo "Checking $action"
            python -c "import yaml; yaml.safe_load(open('$action'))"
          done
