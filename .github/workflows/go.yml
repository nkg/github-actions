name: Go

on:
  workflow_call:
    inputs:
      go-version:
        description: |
          Go version (e.g. '1.23'). Ignored when use-mise is true — the
          version then comes from the consumer's mise.toml.
        type: string
        default: "1.26"
      use-mise:
        description: |
          Install the toolchain via mise (reads the consumer's mise.toml)
          instead of actions/setup-go. Overrides go-version.
        type: boolean
        default: false
      working-directory:
        type: string
        default: "."
      goprivate:
        description: |
          Value for the GOPRIVATE env var, exported for every Go step (mod
          download, vet, staticcheck, govulncheck, test, fuzz). Required for
          private modules: it makes `go` skip the public proxy + checksum DB
          and resolve them directly over git, so the deps-reader credential
          helper is actually consulted. Pair with deps-reader-*. Empty (the
          default) = public-module behaviour, unchanged for existing callers.
        type: string
        default: ""
      gowork-off:
        description: |
          Set GOWORK=off for every Go step so a parent go.work (a workspace
          `replace` pointing a dependency at a local working tree) can't mask
          a stale go.mod pin — the module resolves exactly as go.mod declares,
          matching a fresh single-module CI checkout. Off by default.
        type: boolean
        default: false
      deps-reader-client-id:
        description: |
          GitHub App client ID for private-module access. When set, a scoped
          installation token is minted (via setup-deps-reader) and git's
          credential helper is wired before `go mod download`, so GOPRIVATE
          modules behind private repos resolve. Pair with deps-reader-repositories
          and the DEPS_READER_PRIVATE_KEY secret. Empty = no private-deps step.
        type: string
        default: ""
      deps-reader-repositories:
        description: "Comma-separated repo names (no owner) the token is scoped to. Required when deps-reader-client-id is set."
        type: string
        default: ""
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      run-fmt-check:
        description: "Fail when `gofmt -l` reports unformatted files"
        type: boolean
        default: true
      run-vet:
        type: boolean
        default: true
      run-staticcheck:
        description: "Run honnef.co/go/tools/cmd/staticcheck (slower; off by default)"
        type: boolean
        default: false
      run-golangci-lint:
        description: |
          Run golangci-lint. Off by default — gofmt + vet cover the basics
          for callers without a `.golangci.yml`. When on, the binary is
          installed at golangci-lint-version and `golangci-lint run ./...`
          runs against the (already-downloaded) module cache, so private-deps
          callers must wire deps-reader-* + goprivate as usual.
        type: boolean
        default: false
      golangci-lint-version:
        description: |
          golangci-lint version WITHOUT the leading 'v' (e.g. '2.11.4'),
          matching a mise/.tool-versions pin. Empty installs the latest
          release. A v2-format `.golangci.yml` (version: "2") requires
          golangci-lint >= 2.
        type: string
        default: ""
      run-tests:
        type: boolean
        default: true
      test-args:
        description: "Args appended to `go test`. Default emits coverage."
        type: string
        default: "-race -coverprofile=coverage.out -covermode=atomic ./..."
      run-govulncheck:
        description: "Run golang.org/x/vuln/cmd/govulncheck (blocking — findings fail the job)"
        type: boolean
        default: false
      govulncheck-soft:
        description: |
          Run govulncheck but don't fail the build on findings
          (continue-on-error). Surfaces CVEs without gating CI while an alert
          backlog is drained. Independent of run-govulncheck; setting either
          runs the step, and soft mode wins when both are set.
        type: boolean
        default: false
      upload-coverage:
        type: boolean
        default: true
      upload-artifacts:
        description: "Master switch for uploading artifacts to GitHub Actions storage. Set false to conserve the account-wide Actions storage quota; per-artifact toggles still apply when true."
        type: boolean
        default: true
      artifact-retention-days:
        description: "Days to retain uploaded artifacts. Lower values free the account-wide Actions storage quota sooner."
        type: number
        default: 7
      run-fuzz:
        description: "Run a short `go test -fuzz` smoke pass after the test step (catches panics on each PR; corpus additions are discarded)"
        type: boolean
        default: false
      fuzz-target:
        description: "Fuzz target name, anchored as ^NAME$ (e.g. 'FuzzExtract')"
        type: string
        default: "Fuzz"
      fuzz-time:
        description: "Go duration the fuzzer runs for (e.g. '30s')"
        type: string
        default: "30s"
      fuzz-package:
        description: "Package pattern to fuzz"
        type: string
        default: "./..."
      postgres-enabled:
        description: |
          Start a throwaway Postgres container before the test step and export
          DATABASE_URL into the job env so DB-gated integration tests run in CI.
          Implemented as a conditional `docker run` step (not a `services:`
          block) precisely so it stays opt-in — a `services:` map can't be
          gated by an input, which would force every consumer to pay for
          Postgres. Off by default: zero impact for non-DB consumers.
        type: boolean
        default: false
      postgres-image:
        type: string
        default: "postgres:18-alpine"
      postgres-user:
        type: string
        default: "postgres"
      postgres-password:
        type: string
        default: "postgres"
      postgres-db:
        type: string
        default: "postgres"
    secrets:
      DEPS_READER_PRIVATE_KEY:
        description: "Private key for the deps-reader GitHub App (required when deps-reader-client-id is set)"
        required: false

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    # Exported to every Go step. Empty string is equivalent to unset (no
    # private patterns), so this is a no-op for public-only callers.
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
      # '' = unset (Go auto-detects go.work); 'off' forces single-module
      # resolution so a parent workspace replace can't mask a stale go.mod pin.
      GOWORK: ${{ inputs.gowork-off && 'off' || '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Private-deps access (opt-in). Referenced by full path + floating major
      # tag because a relative `./.github/actions/...` inside a reusable would
      # resolve against the *consumer's* checkout, not this repo. The composite
      # configures git's global credential helper, so it works regardless of
      # which repo is checked out.
      - name: Configure private-deps access
        if: inputs.deps-reader-client-id != ''
        uses: nkg/github-actions/.github/actions/setup-deps-reader@v2
        with:
          app-client-id: ${{ inputs.deps-reader-client-id }}
          app-private-key: ${{ secrets.DEPS_READER_PRIVATE_KEY }}
          repositories: ${{ inputs.deps-reader-repositories }}

      # Same full-path pattern as setup-deps-reader above: the composite
      # installs mise, caches the tool dir, and runs `mise install` against
      # the consumer's mise.toml.
      - name: Setup mise toolchain
        if: inputs.use-mise
        uses: nkg/github-actions/.github/actions/setup-mise@v2
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Set up Go
        if: ${{ !inputs.use-mise }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # setup-go caches the module/build dirs itself; the mise path has no
      # such action, so cache them explicitly (keyed on go.sum).
      - name: Cache Go modules (mise path)
        if: inputs.use-mise
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: mise-go-${{ runner.os }}-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}
          restore-keys: |
            mise-go-${{ runner.os }}-

      - name: Download modules
        run: go mod download

      - name: gofmt
        if: inputs.run-fmt-check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        if: inputs.run-vet
        run: go vet ./...

      - name: staticcheck
        if: inputs.run-staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: golangci-lint
        if: inputs.run-golangci-lint
        # Install via the official script (pinned by version) rather than
        # golangci-lint-action so the version tracks the consumer's mise pin
        # exactly and isn't coupled to the action's golangci-lint v1/v2
        # support matrix. Runs after `go mod download` so the module cache is
        # populated — golangci-lint loads packages from it, no network.
        env:
          VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          set -euo pipefail
          bindir="$(go env GOPATH)/bin"
          if [ -n "$VERSION" ]; then
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
              | sh -s -- -b "$bindir" "v${VERSION}"
          else
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
              | sh -s -- -b "$bindir"
          fi
          "$bindir/golangci-lint" version
          "$bindir/golangci-lint" run ./...

      - name: govulncheck
        if: inputs.run-govulncheck || inputs.govulncheck-soft
        # Soft mode reports CVEs without gating the build. continue-on-error
        # accepts the boolean input directly; false keeps the step blocking.
        continue-on-error: ${{ inputs.govulncheck-soft }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Conditional Postgres for DB-gated integration tests. A `docker run`
      # step rather than a job-level `services:` block, because services
      # can't be gated by an input — this keeps Postgres entirely opt-in so
      # non-DB consumers don't spin one up. Exports DATABASE_URL via
      # $GITHUB_ENV; the Test step inherits it.
      - name: Start Postgres
        if: inputs.run-tests && inputs.postgres-enabled
        env:
          PG_IMAGE: ${{ inputs.postgres-image }}
          PG_USER: ${{ inputs.postgres-user }}
          PG_PASSWORD: ${{ inputs.postgres-password }}
          PG_DB: ${{ inputs.postgres-db }}
        run: |
          set -euo pipefail
          # On self-hosted runners the workspace isn't ephemeral, so a
          # container left over from a prior run (e.g. a cancelled job that
          # skipped teardown) collides on the `ci-postgres` name. Remove any
          # stale one first so the step is idempotent and self-healing.
          docker rm -f ci-postgres >/dev/null 2>&1 || true
          docker run -d --name ci-postgres \
            -e POSTGRES_USER="$PG_USER" \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e POSTGRES_DB="$PG_DB" \
            -p 5432:5432 \
            "$PG_IMAGE"
          # Poll pg_isready inside the container until it accepts connections
          # (image pull + init can take a few seconds), capped at ~60s.
          #
          # -h 127.0.0.1 IS THE POINT, not decoration. On first init the
          # postgres image's entrypoint runs a TEMPORARY server so it can
          # execute initdb and any /docker-entrypoint-initdb.d scripts, then
          # stops it and starts the real one. Upstream starts that temporary
          # server with `listen_addresses=''` ("does not listen on external
          # TCP/IP", docker-entrypoint.sh docker_temp_server_start) — so it is
          # reachable over the Unix socket but NOT over TCP. A socket-based
          # probe therefore returns 0 against the temporary server, the wait
          # exits early, and the first real connection lands during the restart
          # and gets `FATAL 57P03 (cannot_connect_now) the database system is
          # starting up`. Probing TCP cannot pass early: pg_isready exits 1
          # ("rejecting connections") for the whole of that window.
          for i in $(seq 1 60); do
            if docker exec ci-postgres \
                 pg_isready -h 127.0.0.1 -p 5432 -U "$PG_USER" -d "$PG_DB" >/dev/null 2>&1; then
              echo "postgres accepting TCP connections after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::postgres did not become ready in 60s"
              docker logs ci-postgres || true
              exit 1
            fi
            sleep 1
          done
          # Belt and braces: pg_isready reports the listener state, not that a
          # query will succeed. One real round trip closes the gap, and fails
          # here with the server's own logs rather than inside a consumer's
          # test step, where the cause is much harder to read.
          if ! docker exec ci-postgres \
                 psql -h 127.0.0.1 -U "$PG_USER" -d "$PG_DB" -c 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::postgres accepted a connection but could not serve a query"
            docker logs ci-postgres || true
            exit 1
          fi
          # Pick a host the Test step can actually reach. On GitHub-hosted
          # runners the job runs on the VM, so the published port is on
          # localhost. On containerized self-hosted runners the job runs inside
          # a container with a sibling Docker daemon: `-p 5432:5432` publishes
          # to the daemon host, not into this container, so localhost:5432 is
          # refused (the pg_isready check above still passes — it runs INSIDE
          # the container via `docker exec`, so its 127.0.0.1 is the
          # container's own loopback, never this job container's). Detect that
          # case and attach Postgres to the
          # job container's network, addressing it by that network IP.
          PG_HOST=localhost
          if [ -f /.dockerenv ]; then
            SELF="$(cat /etc/hostname)"
            NET="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' "$SELF" 2>/dev/null | head -n1 || true)"
            if [ -n "$NET" ]; then
              docker network connect "$NET" ci-postgres
              PG_HOST="$(docker inspect -f "{{(index .NetworkSettings.Networks \"$NET\").IPAddress}}" ci-postgres)"
              echo "containerized runner: reaching postgres at ${PG_HOST}:5432 via network ${NET}"
            fi
          fi
          echo "DATABASE_URL=postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:5432/${PG_DB}?sslmode=disable" >> "$GITHUB_ENV"

      - name: Test
        if: inputs.run-tests
        env:
          ARGS: ${{ inputs.test-args }}
        run: |
          # shellcheck disable=SC2086
          go test $ARGS

      - name: Fuzz
        if: inputs.run-fuzz
        env:
          TARGET: ${{ inputs.fuzz-target }}
          FUZZTIME: ${{ inputs.fuzz-time }}
          PKG: ${{ inputs.fuzz-package }}
        run: go test -run='^$' -fuzz="^${TARGET}$" -fuzztime="$FUZZTIME" "$PKG"

      # Tear the container down on self-hosted runners, where the VM persists
      # between jobs. always() so a failed/cancelled Test step still cleans up
      # and the next run starts from a clean slate. Guarded by the same inputs
      # as Start Postgres so it only runs when a container was started.
      - name: Stop Postgres
        if: always() && inputs.run-tests && inputs.postgres-enabled
        run: docker rm -f ci-postgres >/dev/null 2>&1 || true

      - name: Upload coverage
        if: inputs.run-tests && inputs.upload-coverage && inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: ${{ inputs.working-directory }}/coverage.out
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
