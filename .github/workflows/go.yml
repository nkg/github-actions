name: Go

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version (or 'mise' to read from .mise.toml/.tool-versions)"
        type: string
        default: "1.23"
      working-directory:
        type: string
        default: "."
      runs-on:
        type: string
        default: "ubuntu-latest"
      run-fmt-check:
        description: "Fail when `gofmt -l` reports unformatted files"
        type: boolean
        default: true
      run-vet:
        type: boolean
        default: true
      run-staticcheck:
        description: "Run honnef.co/go/tools/cmd/staticcheck (slower; off by default)"
        type: boolean
        default: false
      run-tests:
        type: boolean
        default: true
      test-args:
        description: "Args appended to `go test`. Default emits coverage."
        type: string
        default: "-race -coverprofile=coverage.out -covermode=atomic ./..."
      run-govulncheck:
        description: "Run golang.org/x/vuln/cmd/govulncheck"
        type: boolean
        default: false
      upload-coverage:
        type: boolean
        default: true

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        if: inputs.go-version != 'mise'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Set up Go (via mise)
        if: inputs.go-version == 'mise'
        uses: ./.github/actions/setup-mise

      - name: Download modules
        run: go mod download

      - name: gofmt
        if: inputs.run-fmt-check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        if: inputs.run-vet
        run: go vet ./...

      - name: staticcheck
        if: inputs.run-staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: govulncheck
        if: inputs.run-govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Test
        if: inputs.run-tests
        env:
          ARGS: ${{ inputs.test-args }}
        run: |
          # shellcheck disable=SC2086
          go test $ARGS

      - name: Upload coverage
        if: inputs.run-tests && inputs.upload-coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ${{ inputs.working-directory }}/coverage.out
          if-no-files-found: ignore
