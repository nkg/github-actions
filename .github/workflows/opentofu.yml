name: OpenTofu

on:
  workflow_call:
    inputs:
      tofu-version:
        description: "OpenTofu version. Ignored when use-mise is true — the version then comes from the consumer's mise.toml."
        type: string
        # renovate: datasource=github-releases depName=opentofu/opentofu
        default: "1.12.6"
      use-mise:
        description: |
          Install OpenTofu via mise (reads the consumer's mise.toml) instead
          of opentofu/setup-opentofu. Overrides tofu-version. TF_API_TOKEN
          (if set) is written to ~/.tofurc for app.terraform.io on this path.
        type: boolean
        default: false
      working-directory:
        description: "Directory containing the .tf files"
        type: string
        default: "."
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      run-fmt:
        description: "Run tofu fmt -check"
        type: boolean
        default: true
      run-validate:
        description: "Run tofu validate"
        type: boolean
        default: true
      run-plan:
        description: "Run tofu plan"
        type: boolean
        default: true
      backend-config:
        description: "Args passed to `tofu init -backend-config=...` (newline-separated)"
        type: string
        default: ""
      init-backend:
        description: |
          Initialise the backend during `tofu init`. Set false to pass
          `-backend=false`, which initialises providers and modules only.

          Needed for fmt/validate-only jobs on a configuration whose
          `backend` block requires credentials the job has no business
          holding — an S3/R2 backend, for example, where a bare `tofu init`
          fails with "No valid credential sources found" before `validate`
          ever runs. Mutually exclusive with run-plan, which needs state.
        type: boolean
        default: true
      var-file:
        description: "Optional .tfvars file to pass to plan"
        type: string
        default: ""
    secrets:
      TF_API_TOKEN:
        description: "Optional remote backend token (Spacelift, Terraform Cloud, etc.)"
        required: false

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Full path + floating major tag: a relative ./.github/actions path
      # inside a reusable resolves against the consumer's checkout, not this
      # repo. Installs mise, caches the tool dir, runs `mise install`.
      - name: Setup mise toolchain
        if: inputs.use-mise
        uses: nkg/github-actions/.github/actions/setup-mise@v3
        with:
          working-directory: ${{ inputs.working-directory }}

      # setup-opentofu writes the backend credential file itself; the mise
      # path replicates just that bit (default app.terraform.io hostname).
      - name: Configure backend credentials (mise path)
        if: inputs.use-mise
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TF_API_TOKEN:-}" ]; then
            cat > "$HOME/.tofurc" <<EOF
          credentials "app.terraform.io" {
            token = "$TF_API_TOKEN"
          }
          EOF
          fi

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: ${{ !inputs.use-mise }}
        with:
          tofu_version: ${{ inputs.tofu-version }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          # Skip the Node wrapper around `tofu`. It exists only to capture
          # stdout/stderr/exitcode into step outputs, which this reusable
          # never reads — every tofu invocation below is a plain `run:`
          # step. Disabling it drops the node-shim dependency and the
          # trap it causes when `tofu` is called outside the wrapper.
          tofu_wrapper: false

      - name: tofu fmt
        if: inputs.run-fmt
        run: tofu fmt -check -recursive

      # Fail here rather than three steps later with a confusing state
      # error: `plan` needs the backend that `init-backend: false` skipped.
      - name: Check input combination
        if: ${{ !inputs.init-backend && inputs.run-plan }}
        run: |
          echo "::error::init-backend: false skips backend init, so tofu plan cannot run. Set run-plan: false, or give this job backend credentials." >&2
          exit 1

      - name: tofu init
        run: |
          ARGS="-input=false"
          if [ "${{ inputs.init-backend }}" != "true" ]; then
            ARGS="$ARGS -backend=false"
          fi
          if [ -n "${{ inputs.backend-config }}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              ARGS="$ARGS -backend-config=$line"
            done <<< "${{ inputs.backend-config }}"
          fi
          # shellcheck disable=SC2086
          tofu init $ARGS

      - name: tofu validate
        if: inputs.run-validate
        run: tofu validate

      - name: tofu plan
        if: inputs.run-plan
        run: |
          ARGS="-input=false -no-color"
          if [ -n "${{ inputs.var-file }}" ]; then
            ARGS="$ARGS -var-file=${{ inputs.var-file }}"
          fi
          # shellcheck disable=SC2086
          tofu plan $ARGS
