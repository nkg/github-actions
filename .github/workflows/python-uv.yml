name: Python (uv)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      uv-version:
        description: "uv version (empty = latest)"
        type: string
        default: ""
      working-directory:
        description: "Directory containing pyproject.toml"
        type: string
        default: "."
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      run-lint:
        description: "Run ruff format + check"
        type: boolean
        default: true
      run-typecheck:
        description: "Run mypy"
        type: boolean
        default: true
      run-tests:
        description: "Run pytest"
        type: boolean
        default: true
      test-command:
        description: "Override the default pytest invocation"
        type: string
        default: "uv run pytest --cov --cov-report=xml --cov-report=term"
      extras:
        description: "uv sync extras (comma-separated, e.g. 'dev,test')"
        type: string
        default: "dev"
      upload-coverage:
        description: "Upload coverage.xml as an artifact"
        type: boolean
        default: true
      run-pip-audit:
        description: "Run pip-audit against the resolved lockfile"
        type: boolean
        default: false
      pip-audit-args:
        description: "Extra args for pip-audit (e.g. '--ignore-vuln GHSA-…')"
        type: string
        default: ""
      run-bandit:
        description: "Run bandit static security scan"
        type: boolean
        default: false
      bandit-args:
        description: "Extra args for bandit (default scans the working-directory recursively)"
        type: string
        default: "-r ."
      deps-reader-client-id:
        description: |
          GitHub App client ID for private-dep access. When set, a scoped
          installation token is minted (via setup-deps-reader) and git's
          credential helper is wired before `uv sync`, so private git deps
          (e.g. a `[tool.uv.sources]` entry pointing at a private repo)
          resolve over HTTPS. Pair with deps-reader-repositories and the
          DEPS_READER_PRIVATE_KEY secret. Empty = no private-deps step.
        type: string
        default: ""
      deps-reader-repositories:
        description: "Comma-separated repo names (no owner) the token is scoped to. Required when deps-reader-client-id is set."
        type: string
        default: ""
    secrets:
      DEPS_READER_PRIVATE_KEY:
        description: "Private key for the deps-reader GitHub App (required when deps-reader-client-id is set)"
        required: false

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      # Private-deps access (opt-in). Referenced by full path + floating major
      # tag because a relative `./.github/actions/...` inside a reusable would
      # resolve against the *consumer's* checkout, not this repo. The composite
      # configures git's global credential helper, so `uv sync` (which shells
      # out to git for git deps) can reach private repos regardless of checkout.
      - name: Configure private-deps access
        if: inputs.deps-reader-client-id != ''
        uses: nkg/github-actions/.github/actions/setup-deps-reader@v2
        with:
          app-client-id: ${{ inputs.deps-reader-client-id }}
          app-private-key: ${{ secrets.DEPS_READER_PRIVATE_KEY }}
          repositories: ${{ inputs.deps-reader-repositories }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      - name: Set up Python
        run: uv python install ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          if [ -n "${{ inputs.extras }}" ]; then
            EXTRAS_ARGS=""
            IFS=',' read -ra EXTRAS <<< "${{ inputs.extras }}"
            for e in "${EXTRAS[@]}"; do
              EXTRAS_ARGS="$EXTRAS_ARGS --extra $e"
            done
            # shellcheck disable=SC2086
            uv sync --frozen $EXTRAS_ARGS
          else
            uv sync --frozen
          fi

      - name: Lint (ruff)
        if: inputs.run-lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check (mypy)
        if: inputs.run-typecheck
        run: uv run mypy .

      - name: Test (pytest)
        if: inputs.run-tests
        run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: inputs.run-tests && inputs.upload-coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.python-version }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore

      - name: pip-audit
        if: inputs.run-pip-audit
        env:
          EXTRA: ${{ inputs.pip-audit-args }}
        run: |
          # pip-audit reads the resolved env; uv sync above populated .venv.
          # shellcheck disable=SC2086
          uvx pip-audit $EXTRA

      - name: bandit
        if: inputs.run-bandit
        env:
          ARGS: ${{ inputs.bandit-args }}
        run: |
          # shellcheck disable=SC2086
          uvx bandit $ARGS
