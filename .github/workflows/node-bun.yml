name: Node

# Node / TypeScript CI: install, lint, typecheck, test, build, optional audit.
#
# Package-manager-agnostic. Defaults to Bun (unchanged for existing callers);
# pass `package-manager: npm` (or yarn/pnpm), or `use-mise: true` to install
# the toolchain from the repo's mise.toml. Per-step commands auto-derive from
# the package manager; override any with the *-command inputs.

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Package manager: bun | npm | yarn | pnpm"
        type: string
        default: "bun"
      use-mise:
        description: "Install the toolchain via mise (reads the repo's mise.toml) instead of setup-bun/setup-node. Overrides bun-version/node-version."
        type: boolean
        default: false
      bun-version:
        description: "Bun version (only when package-manager is bun and use-mise is false)"
        type: string
        default: "latest"
      node-version:
        description: "Node version (only when package-manager is npm/yarn/pnpm and use-mise is false)"
        type: string
        default: "lts/*"
      working-directory:
        description: "Directory containing package.json / the lockfile"
        type: string
        default: "."
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      install-command:
        description: "Override the install command (empty = derive from package-manager)"
        type: string
        default: ""
      run-lint:
        description: "Run lint script"
        type: boolean
        default: true
      lint-command:
        description: "Override the lint command (empty = `<pm> run lint`)"
        type: string
        default: ""
      run-typecheck:
        description: "Run typecheck script"
        type: boolean
        default: true
      typecheck-command:
        description: "Override the typecheck command (empty = `<pm> run typecheck`)"
        type: string
        default: ""
      run-tests:
        description: "Run test script"
        type: boolean
        default: true
      test-command:
        description: "Override the test command (empty = `bun test`, or `<pm> test` for npm/yarn/pnpm)"
        type: string
        default: ""
      run-build:
        description: "Run build script"
        type: boolean
        default: true
      build-command:
        description: "Override the build command (empty = `<pm> run build`)"
        type: string
        default: ""
      run-audit:
        description: "Run the package manager's audit against the resolved lockfile"
        type: boolean
        default: false
      audit-args:
        type: string
        default: ""

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve toolchain
        id: tc
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            bun)  run="bun run"; install="bun install --frozen-lockfile"; test="bun test";  audit="bun pm audit"; lock="bun.lockb";         cache="$HOME/.bun/install/cache" ;;
            npm)  run="npm run"; install="npm ci";                        test="npm test";  audit="npm audit";   lock="package-lock.json"; cache="$HOME/.npm" ;;
            yarn) run="yarn";    install="yarn install --frozen-lockfile"; test="yarn test"; audit="yarn npm audit"; lock="yarn.lock";        cache="$HOME/.cache/yarn" ;;
            pnpm) run="pnpm run"; install="pnpm install --frozen-lockfile"; test="pnpm test"; audit="pnpm audit";  lock="pnpm-lock.yaml";   cache="$HOME/.local/share/pnpm/store" ;;
            *) echo "::error::unsupported package-manager: $PM (expected bun|npm|yarn|pnpm)"; exit 1 ;;
          esac
          {
            echo "install=$install"
            echo "lint=$run lint"
            echo "typecheck=$run typecheck"
            echo "test=$test"
            echo "build=$run build"
            echo "audit=$audit"
            echo "lock=$lock"
            echo "cache_path=$cache"
          } >> "$GITHUB_OUTPUT"

      # Full path + floating major tag: a relative ./.github/actions path
      # inside a reusable resolves against the consumer's checkout, not this
      # repo. The composite installs mise, caches the tool dir, and runs
      # `mise install` against the consumer's mise config.
      - name: Setup mise toolchain
        if: inputs.use-mise
        uses: nkg/github-actions/.github/actions/setup-mise@v3
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Setup Bun
        if: ${{ !inputs.use-mise && inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Enable corepack
        if: ${{ !inputs.use-mise && (inputs.package-manager == 'yarn' || inputs.package-manager == 'pnpm') }}
        run: corepack enable

      - name: Setup Node
        if: ${{ !inputs.use-mise && inputs.package-manager != 'bun' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.tc.outputs.lock }}

      # The bun/node setup actions above cache the package store themselves;
      # the mise path has no such action, so cache the resolved package
      # manager's download dir explicitly (keyed on whichever lockfile exists).
      - name: Cache package downloads (mise path)
        if: inputs.use-mise
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tc.outputs.cache_path }}
          key: mise-${{ inputs.package-manager }}-${{ runner.os }}-${{ hashFiles('**/bun.lockb', '**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            mise-${{ inputs.package-manager }}-${{ runner.os }}-

      - name: Install
        run: ${{ inputs.install-command != '' && inputs.install-command || steps.tc.outputs.install }}

      - name: Lint
        if: inputs.run-lint
        run: ${{ inputs.lint-command != '' && inputs.lint-command || steps.tc.outputs.lint }}

      - name: Typecheck
        if: inputs.run-typecheck
        run: ${{ inputs.typecheck-command != '' && inputs.typecheck-command || steps.tc.outputs.typecheck }}

      - name: Test
        if: inputs.run-tests
        run: ${{ inputs.test-command != '' && inputs.test-command || steps.tc.outputs.test }}

      - name: Build
        if: inputs.run-build
        run: ${{ inputs.build-command != '' && inputs.build-command || steps.tc.outputs.build }}

      - name: Audit
        if: inputs.run-audit
        env:
          AUDIT: ${{ steps.tc.outputs.audit }}
          ARGS: ${{ inputs.audit-args }}
        run: |
          # Word-splitting on both is intentional.
          # shellcheck disable=SC2086
          $AUDIT $ARGS
