name: Trivy repo scan (filesystem + IaC)

# Runs Trivy in `fs` or `config` mode against the checked-out repo —
# catches CVEs in lockfiles/dependencies (fs) and IaC misconfigurations
# in Terraform/Kubernetes/Dockerfile/Helm/etc. (config).
#
# This is the complement to container-security.yml, which scans built
# images. tfsec is intentionally not used here — Aqua merged tfsec into
# Trivy, and `scan-type: config` is the maintained successor.
#
# Caller permissions — grant only what the run actually uses:
#
#   upload-sarif: false        upload-sarif: true (default)
#   ------------------------   ---------------------------------
#   permissions:               permissions:
#     contents: read             contents: read
#                                actions: read
#                                security-events: write
#
# The SARIF upload lives in its own `sarif-upload` job so that
# `security-events: write` is declared only there. Job-level `permissions:`
# can't be conditional, so when the scan and the upload shared one job every
# caller had to grant `security-events: write` — including private repos
# without Advanced Security, which pass `upload-sarif: false` precisely
# because the upload 403s. They were forced to authorise a permission the
# run never legitimately used.
#
# The two jobs run in parallel rather than `needs:`-chained: the SARIF upload
# is deliberately independent of the scan's pass/fail (findings should reach
# the Security tab even when the table scan fails the build, which is what
# the previous `if: always()` steps did).

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label(s) as a JSON array string (parsed with fromJSON). Pass '[\"self-hosted\", \"linux\", \"x64\"]' to use the self-hosted pool."
        type: string
        default: '["ubuntu-latest"]'
      scan-type:
        description: "Trivy scan mode: fs (lockfiles/deps) or config (IaC misconfig)"
        type: string
        default: "fs"
      severity:
        description: "Comma-separated severities that fail the build"
        type: string
        default: "CRITICAL,HIGH"
      ignore-unfixed:
        description: "Skip vulnerabilities that don't yet have a fix. Only applies to scan-type: fs."
        type: boolean
        default: true
      skip-dirs:
        description: "Newline- or comma-separated directories Trivy should skip"
        type: string
        default: ""
      skip-files:
        description: "Newline- or comma-separated files Trivy should skip"
        type: string
        default: ""
      scan-ref:
        description: "Path to scan. Defaults to the repo root."
        type: string
        default: "."
      upload-sarif:
        description: |
          Upload SARIF to the GitHub Security tab. Auto-skipped on
          pull_request (fork PRs can't write security-events). When true the
          caller must grant `security-events: write` + `actions: read`; when
          false `contents: read` alone is enough (see the header).
        type: boolean
        default: true
      trivy-action-version:
        description: "Pinned version of aquasecurity/trivy-action"
        type: string
        default: "0.36.0"
      timeout-minutes:
        type: number
        default: 15

jobs:
  # Scan + gate. Never touches the Security tab, so `contents: read` is the
  # whole permission surface — see the header for why this is split out.
  trivy:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate scan-type
        env:
          SCAN_TYPE: ${{ inputs.scan-type }}
        run: |
          case "$SCAN_TYPE" in
            fs|config) ;;
            *) echo "::error::invalid scan-type: $SCAN_TYPE (expected fs|config)"; exit 1 ;;
          esac

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trivy scan (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-ref }}
          format: table
          exit-code: '1'
          severity: ${{ inputs.severity }}
          # ignore-unfixed is only meaningful in fs/image mode. Trivy's
          # config scan has no fix metadata, so this flag is a no-op
          # there — passing it unconditionally is harmless.
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          skip-dirs: ${{ inputs.skip-dirs }}
          skip-files: ${{ inputs.skip-files }}

  # The only job that needs security-events:write. Skipped entirely when the
  # caller opts out, so an opted-out caller never has to grant it.
  sarif-upload:
    if: ${{ inputs.upload-sarif && github.event_name != 'pull_request' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # security-events:write + actions:read are required by
    # github/codeql-action/upload-sarif.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      # Duplicated from the trivy job: these run in parallel, so this job
      # can't lean on the other having validated the input first.
      - name: Validate scan-type
        env:
          SCAN_TYPE: ${{ inputs.scan-type }}
        run: |
          case "$SCAN_TYPE" in
            fs|config) ;;
            *) echo "::error::invalid scan-type: $SCAN_TYPE (expected fs|config)"; exit 1 ;;
          esac

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-ref }}
          format: sarif
          output: trivy-${{ inputs.scan-type }}.sarif
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          skip-dirs: ${{ inputs.skip-dirs }}
          skip-files: ${{ inputs.skip-files }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-${{ inputs.scan-type }}.sarif
          # Distinguish fs vs config findings in the Security tab so they
          # don't overwrite each other when both are wired up.
          category: trivy-${{ inputs.scan-type }}
