name: Setup mise
description: Install mise and run `mise install` for the current repo

inputs:
  install:
    description: "Run `mise install` after setup"
    required: false
    default: "true"
  version:
    description: "mise version (default: latest)"
    required: false
    default: "latest"
  experimental:
    description: "Set MISE_EXPERIMENTAL=1"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          curl https://mise.run | sh
        else
          curl https://mise.run | MISE_VERSION=v${{ inputs.version }} sh
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

    - name: Configure mise
      shell: bash
      run: |
        echo "MISE_YES=1" >> "$GITHUB_ENV"
        if [ "${{ inputs.experimental }}" = "true" ]; then
          echo "MISE_EXPERIMENTAL=1" >> "$GITHUB_ENV"
        fi

    - name: Cache mise tools
      uses: actions/cache@v5
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-${{ hashFiles('**/.mise.toml', '**/mise.toml', '**/.tool-versions') }}
        restore-keys: |
          mise-${{ runner.os }}-

    - name: mise install
      if: inputs.install == 'true'
      shell: bash
      run: mise install
