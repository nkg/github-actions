name: Setup deps-reader
description: |
  Mint a scoped GitHub App installation token and configure git to use it
  for HTTPS clones. Lets workflows access private deps (uv git deps, hex
  deps from private repos, go module proxies pointing at private repos)
  without bundling a PAT.

  Uses `credential.helper store --file=<path>` instead of
  `url.<token>@github.com.insteadOf` because the latter is not honoured
  by uv/hex/go subprocess fetches that re-resolve git deps (e.g. after
  a lockfile cache invalidation). The credential helper IS honoured by
  every git invocation that reads the global config.

  Caller must run actions/checkout BEFORE invoking this — composite
  actions cannot pull themselves onto the runner.

inputs:
  app-client-id:
    description: "GitHub App client ID (public on the App's page)"
    required: true
  app-private-key:
    description: "GitHub App private key (pass via secrets)"
    required: true
  repositories:
    description: "Comma-separated list of repo names (no owner) the token should be scoped to"
    required: true
  owner:
    description: "Repo owner (defaults to github.repository_owner)"
    required: false
    default: ""

outputs:
  token:
    description: "The minted installation token"
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Mint GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.owner != '' && inputs.owner || github.repository_owner }}
        repositories: ${{ inputs.repositories }}

    - name: Configure git credential helper
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        # If a consumer repo previously used the `url.<token>@github.com/.insteadOf`
        # pattern (typed inline or via a local composite), those entries are
        # still sitting in `~/.gitconfig` on every persistent self-hosted
        # runner that ever ran the old pattern.  url.insteadOf rewrites
        # happen before credential helpers are consulted, so git silently
        # substitutes the *expired* baked-in token into every github.com
        # URL and GitHub responds 401 with the misleading
        #   "Invalid username or token. Password authentication is not
        #    supported for Git operations."
        # message — even though the fresh deps-reader token we just minted
        # is waiting in $RUNNER_TEMP/git-credentials.
        #
        # Purge any url.*.insteadOf entries before installing the helper.
        # `git config --get-regexp` lowercases key names in its output
        # (insteadOf → insteadof), so the regex matches the lowercase form.
        # See sproncy/sproncy-distillery#128 for the original incident.
        if git config --global --get-regexp '^url\..*\.insteadof$' >/dev/null 2>&1; then
          echo "Found stale url.*.insteadOf entries — clearing:"
          git config --global --get-regexp '^url\..*\.insteadof$' | sed 's/:.*$/=<redacted>/'
          while IFS=' ' read -r key _value; do
            section=${key%.insteadof}
            git config --global --remove-section "$section" 2>/dev/null || true
          done < <(git config --global --get-regexp '^url\..*\.insteadof$' || true)
        else
          echo "No url.*.insteadOf entries to clear."
        fi

        # Per-job credential file in $RUNNER_TEMP — disappears with the runner.
        cred_file="$RUNNER_TEMP/git-credentials"
        : > "$cred_file"
        chmod 600 "$cred_file"
        printf 'https://x-access-token:%s@github.com\n' "$TOKEN" >> "$cred_file"
        # --replace-all because credential.helper is multi-valued; on a
        # persistent self-hosted runner repeated jobs would otherwise stack
        # up entries (and could leak a stale helper from a prior job).
        git config --global --replace-all credential.helper "store --file=$cred_file"
