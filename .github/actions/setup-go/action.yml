name: Setup Go
description: Thin wrapper over actions/setup-go for org-wide version pinning

inputs:
  go-version:
    description: "Go version (e.g. '1.23')"
    required: false
    default: "1.23"
  working-directory:
    description: "Project subdirectory (used for cache-dependency-path)"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum
