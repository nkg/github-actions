name: Setup Go
description: Thin wrapper over actions/setup-go for org-wide version pinning

inputs:
  go-version:
    description: "Go version (e.g. '1.23')"
    required: false
    default: "1.26"
  working-directory:
    description: "Project subdirectory (used for cache-dependency-path)"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum
