name: Setup cosign
description: Thin wrapper over sigstore/cosign-installer so the version is pinned org-wide

inputs:
  cosign-version:
    description: "cosign release (e.g. v2.4.1). Empty = installer default."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Verify
      shell: bash
      run: cosign version
