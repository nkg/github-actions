# Local dev tooling — provisions everything lefthook.yml needs.
# Versions pinned to match this repo's own CI defaults (self-test.yml /
# secret-scan.yml) so local hooks and CI never drift; renovate's mise
# manager bumps these alongside the workflow input defaults.

[tools]
lefthook = "latest"
actionlint = "1.7.12"
betterleaks = "1.8.1"
uv = "latest"
taplo = "latest"

[hooks]
# Auto-register git hooks when entering the project directory.
enter = "lefthook install"
